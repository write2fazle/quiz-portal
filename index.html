        var noteInput = document.createElement('textarea');
        noteInput.placeholder = 'Admin note (optional, shown in the resolved log)';
        noteInput.style.cssText = 'width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;margin:8px 0;min-height:50px;';
        block.appendChild(noteInput);

        var btnRow = document.createElement('div');
        btnRow.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;';

        async function recalculateAndPersistAllAffectedAttempts(questionId, acceptedIndexes, remarkText){
          // Always start from the current database state. This prevents stale browser
          // state from overwriting a score that was changed by another action/user.
          var rows = await supaRequest(supaUrl('quiz_attempts', '?select=id,data,created_at,updated_at'));
          var attempts = (rows || []).map(function(row){
            var a = parseJsonValue(row.data, {});
            a.dbRowId = row.id;
            return a;
          });
          var accepted = (acceptedIndexes || []).map(function(i){return Number(i);});
          var affected = attempts.filter(function(a){
            return (a.answers || []).some(function(ans){return ans.questionId === questionId;});
          });
          if(!affected.length) return [];

          var saved = [];
          for(var i=0;i<affected.length;i++){
            var attempt = affected[i];
            var total = 0;
            (attempt.answers || []).forEach(function(ans){
              // Recalculate every answer using its question's current accepted answers.
              var q = state.data.questionBank.find(function(x){return x.id === ans.questionId;});
              var indexes = q && Array.isArray(q.acceptedIndexes) ? q.acceptedIndexes.map(Number) : [];
              var correct = indexes.indexOf(Number(ans.selectedIndex)) !== -1;
              if(ans.questionId === questionId){
                correct = accepted.indexOf(Number(ans.selectedIndex)) !== -1;
                if(correct && remarkText) ans.remark = remarkText;
              }
              ans.isCorrect = correct;
              if(correct) total++;
            });
            attempt.score = total;
            if(!attempt.total) attempt.total = (attempt.answers || []).length;

            var payload = {data:JSON.stringify(attempt), updated_at:new Date().toISOString()};
            var updated = await supaRequest(supaUrl('quiz_attempts')+'?id=eq.'+encodeURIComponent(attempt.dbRowId), {
              method:'PATCH',
              headers:{'Prefer':'return=representation'},
              body:JSON.stringify(payload)
            });
            // Some deployments expose a generated UUID in the table id while the
            // stable application attempt id lives inside data.id/attemptId. If the
            // first PATCH affected no row, retry using the embedded attempt id.
            if(!updated || !updated.length){
              var embeddedId = attempt.id || attempt.attemptId;
              if(embeddedId){
                updated = await supaRequest(supaUrl('quiz_attempts')+'?or=(data->>id.eq.'+encodeURIComponent(embeddedId)+',data->>attemptId.eq.'+encodeURIComponent(embeddedId)+')', {
                  method:'PATCH',
                  headers:{'Prefer':'return=representation'},
                  body:JSON.stringify(payload)
                });
              }
            }
            if(!updated || !updated.length) throw new Error('Could not update quiz attempt '+attempt.dbRowId+' (score='+attempt.score+').');

            // Read back by BOTH physical row id and embedded application id. Do not
            // claim success unless the database contains the new score and answer.
            var verify = await supaRequest(supaUrl('quiz_attempts')+'?select=id,data&id=eq.'+encodeURIComponent(attempt.dbRowId));
            if(!verify || !verify.length){
              var embeddedId2 = attempt.id || attempt.attemptId;
              if(embeddedId2) verify = await supaRequest(supaUrl('quiz_attempts')+'?select=id,data&or=(data->>id.eq.'+encodeURIComponent(embeddedId2)+',data->>attemptId.eq.'+encodeURIComponent(embeddedId2)+')');
            }
            if(!verify || !verify.length) throw new Error('Updated attempt could not be verified.');
            var stored = parseJsonValue(verify[0].data, {});
            var storedAnswer = (stored.answers || []).find(function(a){return a.questionId===questionId;});
            var localAnswer = (attempt.answers || []).find(function(a){return a.questionId===questionId;});
            if(Number(stored.score)!==Number(attempt.score)) throw new Error('Database score verification failed for '+(attempt.userName||attempt.userId));
            if(storedAnswer && localAnswer && !!storedAnswer.isCorrect!==!!localAnswer.isCorrect) throw new Error('Database answer verification failed for '+(attempt.userName||attempt.userId));
            saved.push(attempt);
          }
          return saved;
        }

        async function resolveDispute(resolution){
          var oldStatuses = state.data.disputes.map(function(x){return {id:x.id,status:x.status,resolution:x.resolution,resolvedAt:x.resolvedAt};});
          var now = Date.now();
          var q = state.data.questionBank.find(function(x){return x.id===d.questionId;});
          var affectedDisputes = state.data.disputes.filter(function(x){
            return x.attemptId === d.attemptId && x.questionId === d.questionId && x.status === 'pending';
          });
          if(!affectedDisputes.length) affectedDisputes=[d];

          affectedDisputes.forEach(function(item){
            item.status='resolved';
            item.resolution=resolution;
            item.adminNote=noteInput.value.trim();
            item.resolvedAt=now;
            // If Admin accepted the disputed answer, all duplicate pending
            // dispute records for the same attempt/question are resolved too.
          });

          var changedAttempts=[];
          var finalAcceptedIndexes=[];
          if(q){
            if(resolution === 'disputed_correct' || resolution === 'both_correct'){
              q.acceptedIndexes = Array.from(new Set([Number(q.correctIndex), Number(d.selectedIndex)]));
            }else if(resolution === 'original_correct'){
              q.acceptedIndexes=[Number(q.correctIndex)];
            }
            finalAcceptedIndexes=q.acceptedIndexes.map(Number);
          }

          try{
            // Save the dispute decision first.
            await Promise.all(affectedDisputes.map(function(item){
              return supaRequest(supaUrl('disputes')+'?id=eq.'+encodeURIComponent(item.dbRowId || item.id), {
                method:'PATCH', headers:{'Prefer':'return=representation'},
                body:JSON.stringify({data:JSON.stringify(item),updated_at:new Date().toISOString()})
              });
            }));

            // Verify every dispute decision was actually persisted in the database.
            var disputeVerify = await Promise.all(affectedDisputes.map(function(item){
              return supaRequest(supaUrl('disputes')+'?select=id,data&id=eq.'+encodeURIComponent(item.dbRowId || item.id));
            }));
            disputeVerify.forEach(function(rows, idx){
              if(!rows || !rows.length) throw new Error('Resolved dispute was not found in Supabase.');
              var storedDispute = parseJsonValue(rows[0].data, {});
              if(storedDispute.status !== 'resolved' || storedDispute.resolution !== resolution){
                throw new Error('Dispute resolution was not persisted for '+(affectedDisputes[idx].id || affectedDisputes[idx].dbRowId)+'.');
              }
            });

            // Save the Question Bank decision.
            if(q){
              await supaRequest(supaUrl('question_bank')+'?id=eq.'+encodeURIComponent(q.dbRowId || q.id), {
                method:'PATCH', headers:{'Prefer':'return=representation'},
                body:JSON.stringify({data:JSON.stringify(q),updated_at:new Date().toISOString()})
              });
              var qVerify = await supaRequest(supaUrl('question_bank')+'?select=id,data&id=eq.'+encodeURIComponent(q.dbRowId || q.id));
              if(!qVerify || !qVerify.length) throw new Error('Updated question was not found in Supabase.');
              var storedQuestion = parseJsonValue(qVerify[0].data, {});
              var storedAccepted = Array.isArray(storedQuestion.acceptedIndexes) ? storedQuestion.acceptedIndexes.map(Number).sort(function(a,b){return a-b;}) : [];
              var expectedAccepted = finalAcceptedIndexes.slice().map(Number).sort(function(a,b){return a-b;});
              if(JSON.stringify(storedAccepted)!==JSON.stringify(expectedAccepted)) throw new Error('Accepted answer state was not persisted correctly.');
            }

            // IMPORTANT: fetch ALL attempts directly from Supabase and recalculate
            // every affected user from the authoritative database state.
            var remarkText = resolution === 'both_correct'
              ? 'Both answers are accepted as correct for this question.'
              : resolution === 'disputed_correct'
                ? 'Your answer was accepted as correct after a dispute review.'
                : 'Original answer confirmed correct.';
            changedAttempts = await recalculateAndPersistAllAffectedAttempts(d.questionId, finalAcceptedIndexes, remarkText);

            // Re-read authoritative Supabase state before showing success.
            var freshAfterResolve = await gsGetAllData();
            state.data = normalizeData(freshAfterResolve);
            if(!state.lastSyncedData) state.lastSyncedData={};
            state.lastSyncedData.disputes=JSON.parse(JSON.stringify(state.data.disputes));
            state.lastSyncedData.questionBank=JSON.parse(JSON.stringify(state.data.questionBank));
            state.lastSyncedData.quizAttempts=JSON.parse(JSON.stringify(state.data.quizAttempts));
            render();
            notify('Dispute resolved. Final accepted answer and all affected user marks have been saved and verified.','success');
          }catch(e){
            // Roll back all locally changed dispute states if any database write fails.
            oldStatuses.forEach(function(old){
              var item=state.data.disputes.find(function(x){return x.id===old.id;});
              if(item){item.status=old.status;item.resolution=old.resolution;item.resolvedAt=old.resolvedAt;}
            });
            console.error('Dispute resolution save error:',e);
            notify('Dispute approval could not be saved. '+e.message,'error');
          }
        }
        var btnDisputed = document.createElement('button');
        btnDisputed.type = 'button';
        btnDisputed.className = 'btn primary small'; btnDisputed.textContent = 'Disputed answer is correct';
        btnDisputed.onclick = async function(){ if(btnDisputed.disabled) return; btnDisputed.disabled=true; btnOriginal.disabled=true; btnBoth.disabled=true; try{ await resolveDispute('disputed_correct'); } catch(e){ btnDisputed.disabled=false; btnOriginal.disabled=false; btnBoth.disabled=false; } };
        var btnOriginal = document.createElement('button');
        btnOriginal.type = 'button';
        btnOriginal.className = 'btn secondary small'; btnOriginal.textContent = 'Original answer confirmed correct';
        btnOriginal.onclick = async function(){ if(btnOriginal.disabled) return; btnDisputed.disabled=true; btnOriginal.disabled=true; btnBoth.disabled=true; try{ await resolveDispute('original_correct'); } catch(e){ btnDisputed.disabled=false; btnOriginal.disabled=false; btnBoth.disabled=false; } };
        var btnBoth = document.createElement('button');
        btnBoth.type = 'button';
        btnBoth.className = 'btn secondary small'; btnBoth.textContent = 'Both answers accepted';
        btnBoth.onclick = async function(){ if(btnBoth.disabled) return; btnDisputed.disabled=true; btnOriginal.disabled=true; btnBoth.disabled=true; try{ await resolveDispute('both_correct'); } catch(e){ btnDisputed.disabled=false; btnOriginal.disabled=false; btnBoth.disabled=false; } };
        btnRow.appendChild(btnDisputed); btnRow.appendChild(btnOriginal); btnRow.appendChild(btnBoth);
        block.appendChild(btnRow);
        pendingCard.appendChild(block);
      });
    }
    wrap.appendChild(pendingCard);

    var resolvedCard = document.createElement('div');
    resolvedCard.className = 'card';
    resolvedCard.innerHTML = '<div class="section-title">Resolved disputes ('+resolved.length+')</div>';
    if(resolved.length === 0){
      resolvedCard.innerHTML += '<div class="empty-note">No disputes resolved yet.</div>';
    }else{
      var resTable = document.createElement('table');
      resTable.className = 'data-table';
      resTable.innerHTML = '<tr><th>Question</th><th>Raised by</th><th>Outcome</th><th>Resolved</th></tr>';
      var resolutionLabels = {disputed_correct:'Disputed answer accepted', original_correct:'Original answer confirmed', both_correct:'Both answers accepted'};
      resolved.forEach(function(d){
        var tr = document.createElement('tr');
        tr.innerHTML = '<td>'+escapeHtml(d.questionText)+'</td><td>'+escapeHtml(d.userName)+'</td><td>'+(resolutionLabels[d.resolution]||d.resolution)+'</td><td>'+fmtDateTime(d.resolvedAt)+'</td>';
        resTable.appendChild(tr);
      });
      resolvedCard.appendChild(resTable);
    }
    wrap.appendChild(resolvedCard);
    return wrap;
  }

  function renderUserQuizHome(){
    var wrap = document.createElement('div');

    wrap.appendChild(renderKnowledgeUpdatesCard());
    if(!user.team){
      var noTeamCard = document.createElement('div');
      noTeamCard.className = 'card empty-note';
      noTeamCard.textContent = 'You are not assigned to a team yet. Ask your admin to assign one before you can take a quiz.';
      wrap.appendChild(noTeamCard);
      return wrap;
    }
    // Every user can see the global top 3 across all teams.
    wrap.appendChild(renderLeaderboardCard(3, null));

    var card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = '<div class="section-title">Available quizzes for '+escapeHtml(user.team)+'</div>';

    // IMPORTANT: quiz_attempts is the ONLY source of truth for the no-retake
    // rule. Do not use localStorage or userCompletedQuizzes meta here.
    // Therefore, if an Admin deletes a user's attempt from Supabase,
    // that quiz becomes available again after the next data refresh/login.
    var completed = (state.data.quizAttempts || []).filter(function(a){
      return a && a.userId === state.currentUserId;
    }).map(function(a){ return a.quizId; });
    var available = state.data.quizzes.filter(function(q){
      return q.team === user.team &&
             quizStatus(q) !== 'off' && quizStatus(q) !== 'ended' &&
             completed.indexOf(q.id) === -1;
    });
    if(available.length === 0){
      card.innerHTML += '<div class="empty-note">No quizzes have been scheduled for your team yet.</div>';
    }else{
      available.slice().sort(function(a,b){ return (a.scheduledDate+a.scheduledTime) < (b.scheduledDate+b.scheduledTime) ? 1 : -1; }).forEach(function(quiz){
        var row = document.createElement('div');
        row.className = 'quiz-list-row';
        var st = quizStatus(quiz);
        var alreadyDone = completed.indexOf(quiz.id) !== -1;
        var info = document.createElement('div');
        info.innerHTML = '<div class="quiz-list-title">'+escapeHtml(quiz.title)+'</div>'+
          '<div class="quiz-list-meta">'+quiz.questionIds.length+' question(s) &middot; '+quiz.durationMinutes+' min &middot; '+fmtDate(quiz.startDate||quiz.scheduledDate)+' '+(quiz.startTime||quiz.scheduledTime)+' → '+fmtDate(quiz.endDate||quiz.scheduledDate)+' '+(quiz.endTime||'')+'</div>';
        row.appendChild(info);
        var actionBtn = document.createElement('button');
        if(alreadyDone){
          actionBtn.className = 'btn secondary small'; actionBtn.textContent = 'Completed'; actionBtn.disabled = true;
        }else if(st === 'scheduled'){
          actionBtn.className = 'btn secondary small'; actionBtn.textContent = 'Scheduled'; actionBtn.disabled = true;
        }else{
          actionBtn.className = 'btn primary small'; actionBtn.textContent = 'Start quiz';
          actionBtn.onclick = function(){ if(actionBtn.dataset.busy==='1') return; actionBtn.dataset.busy='1'; openQuiz(quiz).finally(function(){ actionBtn.dataset.busy='0'; }); };
        }
        row.appendChild(actionBtn);
        card.appendChild(row);
      });
    }
    wrap.appendChild(card);
    return wrap;
  }

  /* ================= USER: HISTORY ================= */
  function renderAnswerReviewBlock(attempt, ans, idx, keyPrefix){
    var block = document.createElement('div');
    block.className = 'review-block';
    var quizForAttempt = state.data.quizzes.find(function(q){return q.id===attempt.quizId;});
    var published = !quizForAttempt || quizResultsPublished(quizForAttempt);
    var currentQ = state.data.questionBank.find(function(q){return q.id===ans.questionId;});
    var resolvedDispute = state.data.disputes.find(function(d){return d.attemptId===attempt.id && d.questionId===ans.questionId && d.status==='resolved';});
    if(currentQ && resolvedDispute){
      ans.isCorrect = isAnswerAccepted(currentQ, ans.selectedIndex);
      ans.correctOption = (currentQ.options && currentQ.options[currentQ.correctIndex]) || ans.correctOption;
    }
    block.innerHTML = '<div class="review-q">'+escapeHtml(ans.questionText)+'</div>'+
      '<div class="review-a">Your answer: <b style="color:'+(ans.isCorrect?'var(--green)':'var(--red)')+';">'+escapeHtml(ans.selectedOption)+'</b>'+(published && !ans.isCorrect?' &middot; Correct: '+escapeHtml(ans.correctOption):'')+'</div>'+
      (ans.remark ? '<div class="review-remark">\u2713 '+escapeHtml(ans.remark)+'</div>' : '');

    if(!published){ return block; }
    if(!ans.isCorrect){
      if(resolvedDispute){
        var resolvedLabel = document.createElement('div');
        resolvedLabel.className='review-remark';
        resolvedLabel.textContent='Dispute resolved — no further dispute can be raised for this answer.';
        block.appendChild(resolvedLabel);
        return block;
      }
      var disputeKey = keyPrefix + '-' + idx;
      if(state.disputingAnswerIndex === disputeKey){
        var noteInput = document.createElement('textarea');
        noteInput.placeholder = 'Why do you think your answer should be correct? (optional)';
        noteInput.style.cssText = 'width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;margin-top:8px;min-height:60px;';
        var optionsBox=document.createElement('div'); optionsBox.style.cssText='margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:12px;';
        optionsBox.innerHTML='<b>Question & Answer</b><div style="margin-top:6px;">'+(ans.options||[]).map(function(op,i){return '<div style="padding:3px 0;">'+String.fromCharCode(65+i)+'. '+escapeHtml(op)+(i===ans.selectedIndex?' <b>(Your answer)</b>':'')+(i===ans.correctIndex?' <b>(Marked correct)</b>':'')+'</div>';}).join('')+'</div>';
        block.appendChild(optionsBox); block.appendChild(noteInput);
        var submitBtn = document.createElement('button');
        submitBtn.className = 'btn primary small'; submitBtn.style.marginTop = '8px'; submitBtn.textContent = 'Submit dispute';
        submitBtn.onclick = async function(){
          var user = currentUser();
          var dispute = {
            id: uid(), attemptId: attempt.id, userId: state.currentUserId, userName: user.name, userEmail: user.email || '', team: user.team,
            questionId: ans.questionId, questionText: ans.questionText,
            selectedIndex: ans.selectedIndex, selectedOption: ans.selectedOption,
            originalCorrectIndex: ans.correctIndex, originalCorrectOption: ans.correctOption,
            options: ans.options || [], note: noteInput.value.trim(),
            status: 'pending', resolution: null, adminNote: '', createdAt: Date.now(), resolvedAt: null
          };
          submitBtn.disabled=true; submitBtn.textContent='Submitting...';
          try{
            // Never create a second pending dispute for the same attempt/question.
            // This also protects against double-clicks and stale browser state.
            var localPending = state.data.disputes.find(function(x){
              return x.status==='pending' && x.attemptId===dispute.attemptId && x.questionId===dispute.questionId;
            });
            if(localPending){
              state.disputingAnswerIndex=null; state.historyOpenAttemptId=attempt.id; render();
              notify('A dispute for this question is already pending.','info');
              return;
            }
            var remote = await supaRequest(supaUrl('disputes')+'?select=id,data');
            var remoteRows = Array.isArray(remote) ? remote : [];
            var remotePending = remoteRows.some(function(row){
              try{ var x=typeof row.data==='string'?JSON.parse(row.data):row.data; return x && x.status==='pending' && x.attemptId===dispute.attemptId && x.questionId===dispute.questionId; }catch(_){ return false; }
            });
            if(remotePending){
              state.data.disputes = await supabaseGetCollection('disputes');
              state.disputingAnswerIndex=null; state.historyOpenAttemptId=attempt.id; render();
              notify('A dispute for this question is already pending.','info');
              return;
            }
            // Save the dispute directly to public.disputes.
            await supaRequest(supaUrl('disputes'), {
              method:'POST',
              headers:{'Prefer':'return=representation'},
              body:JSON.stringify({id:dispute.id, data:JSON.stringify(dispute), created_at:new Date(dispute.createdAt).toISOString(), updated_at:new Date().toISOString()})
            });
            state.data.disputes.push(dispute);
            if(!state.lastSyncedData) state.lastSyncedData={};
            state.lastSyncedData.disputes=JSON.parse(JSON.stringify(state.data.disputes));
            state.disputingAnswerIndex = null;
            state.historyOpenAttemptId = attempt.id;
            render();
            notify('Dispute submitted successfully and saved to database.','success');
          }catch(e){
            console.error('Dispute save error:',e);
            submitBtn.disabled=false; submitBtn.textContent='Submit dispute';
            notify('Dispute could not be saved. '+e.message,'error');
          }
        };
        block.appendChild(submitBtn);
        var cancelDBtn = document.createElement('button');
        cancelDBtn.className = 'btn secondary small'; cancelDBtn.style.marginTop = '8px'; cancelDBtn.style.marginLeft = '6px'; cancelDBtn.textContent = 'Cancel';
        cancelDBtn.onclick = function(){ state.disputingAnswerIndex = null; render(); };
        block.appendChild(cancelDBtn);
      }else{
        var existingDispute = state.data.disputes.find(function(d){ return d.attemptId === attempt.id && d.questionId === ans.questionId; });
        var disputeBtn = document.createElement('button');
        disputeBtn.className = 'btn secondary small'; disputeBtn.style.marginTop = '8px';
        if(existingDispute && existingDispute.status === 'pending'){
          disputeBtn.textContent = 'Dispute submitted \u2014 pending review';
          disputeBtn.disabled = true;
        }else if(existingDispute && existingDispute.status === 'resolved'){
          disputeBtn.textContent = 'Dispute resolved';
          disputeBtn.disabled = true;
          disputeBtn.title = 'This question has already been reviewed and resolved. A second dispute cannot be raised.';
        }else{
          disputeBtn.textContent = 'Raise a dispute';
          disputeBtn.disabled = true; disputeBtn.onclick = null;
        }
        block.appendChild(disputeBtn);
      }
    }
    return block;
  }

  function renderUserHistory(){
    var wrap = document.createElement('div');
    var card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;"><div class="section-title" style="margin:0;">My quiz history</div><button id="refreshHistoryBtn" class="btn secondary small">↻ Refresh marks</button></div>';
    card.querySelector('#refreshHistoryBtn').onclick = async function(){
      var btn=this; btn.disabled=true; btn.textContent='Refreshing...';
      try{
        var fresh=await gsGetAllData();
        state.data=normalizeData(fresh); render(); notify('Latest marks loaded from database.','success');
      }catch(e){ notify('Could not refresh marks: '+e.message,'error'); btn.disabled=false; btn.textContent='↻ Refresh marks'; }
    };

    var filterRow = document.createElement('div');
    filterRow.className = 'filter-row';
    var titleFilterEl = document.createElement('div'); titleFilterEl.className = 'form-row';
    titleFilterEl.innerHTML = '<label>Search by quiz title</label>';
    var titleInput = document.createElement('input'); titleInput.type = 'text'; titleInput.placeholder = 'e.g. Daily Quiz';
    titleInput.value = state.historySearchTitle;

    titleFilterEl.appendChild(titleInput);

    var titleSelectEl = document.createElement('div'); titleSelectEl.className = 'form-row';

    var titleSelect = document.createElement('select');
    var allOp = document.createElement('option'); allOp.value=''; allOp.textContent='All quizzes';
    titleSelect.appendChild(allOp);
    var myQuizTitles = [];
    state.data.quizAttempts.filter(function(a){return a.userId===state.currentUserId;}).forEach(function(a){
      if(myQuizTitles.indexOf(a.quizTitle) === -1) myQuizTitles.push(a.quizTitle);
    });
    myQuizTitles.sort().forEach(function(t){
      var op = document.createElement('option'); op.value = t; op.textContent = t;
      if(state.historySearchTitle === t) op.selected = true;
      titleSelect.appendChild(op);
    });
    titleSelect.onchange = function(){ state.historySearchTitle = titleSelect.value; titleInput.value = titleSelect.value; renderHistoryList(); };
    titleSelectEl.appendChild(titleSelect);

    var dateFilterEl = document.createElement('div'); dateFilterEl.className = 'form-row';
    dateFilterEl.innerHTML = '<label>Filter by date</label>';
    var dateInput = document.createElement('input'); dateInput.type = 'date'; dateInput.value = state.historySearchDate;
    dateInput.onchange = function(){ state.historySearchDate = dateInput.value; renderHistoryList(); };
    dateFilterEl.appendChild(dateInput);
    var clearBtn = document.createElement('button');
    clearBtn.className = 'btn secondary small'; clearBtn.textContent = 'Clear filters';
    clearBtn.onclick = function(){ state.historySearchTitle=''; state.historySearchDate=''; render(); };
    filterRow.appendChild(titleFilterEl); filterRow.appendChild(titleSelectEl); filterRow.appendChild(dateFilterEl); filterRow.appendChild(clearBtn);
    card.appendChild(filterRow);

    var listHolder = document.createElement('div');
    card.appendChild(listHolder);

    async function refreshMyAttemptsFromServer(){
      try{
        var rows = await supaRequest(supaUrl('quiz_attempts','?select=id,data,created_at,updated_at'));
        var mine = (rows||[]).map(function(row){ var a=parseJsonValue(row.data,{}); a.dbRowId=row.id; return a; }).filter(function(a){return a.userId===state.currentUserId;});
        var others = (state.data.quizAttempts||[]).filter(function(a){return a.userId!==state.currentUserId;});
        state.data.quizAttempts = others.concat(mine);
      }catch(e){ console.warn('Could not refresh user attempts:',e); }
    }

    function renderHistoryList(){
      listHolder.innerHTML = '';
      var myAttempts = state.data.quizAttempts.filter(function(a){return a.userId===state.currentUserId;});
      if(state.historySearchTitle.trim()){
        var q = state.historySearchTitle.trim().toLowerCase();
        myAttempts = myAttempts.filter(function(a){ return a.quizTitle.toLowerCase().indexOf(q) !== -1; });
      }
      if(state.historySearchDate){
        myAttempts = myAttempts.filter(function(a){ return a.quizDate === state.historySearchDate; });
      }
      myAttempts.sort(function(a,b){return b.finishedAt-a.finishedAt;});
      if(myAttempts.length === 0){
        listHolder.innerHTML = '<div class="empty-note">No matching quiz history.</div>';
        return;
      }
      myAttempts.forEach(function(a){
        var quiz = state.data.quizzes.find(function(q){return q.id===a.quizId;});
        var published = !quiz || quizResultsPublished(quiz);
        var pct = published ? Math.round(a.score/a.total*100) : null;
        var block = document.createElement('div');
        block.style.cssText = 'border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px;';
        if(!published){ var pq=quiz||{}; block.innerHTML='<div style="font-weight:600;">'+escapeHtml(a.quizTitle)+'</div><div style="font-size:12px;color:var(--text-mute);margin-top:6px;">Submitted successfully. Your marks and answers will be published automatically after '+escapeHtml(fmtDateTime(quizEndMs(pq)))+'.</div>'; }
        var head = document.createElement('div');
        head.style.cssText = 'display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;';
        head.innerHTML = '<div><div style="font-weight:700;font-size:14px;">'+escapeHtml(a.quizTitle)+'</div><div style="font-size:11px;color:var(--text-dim);">'+fmtDate(a.quizDate)+' &middot; completed '+fmtDateTime(a.finishedAt)+'</div></div>'+
          '<div style="font-weight:700;font-size:15px;">'+(published ? a.score+' / '+a.total+' ('+pct+'%)' : 'Result pending')+'</div>';
        block.appendChild(head);

        var toggleBtn = document.createElement('button');
        toggleBtn.className = 'btn secondary small'; toggleBtn.style.marginTop = '10px';
        toggleBtn.textContent = 'View questions & answers';
        var reviewHolder = document.createElement('div');
        reviewHolder.style.display = 'none';
        reviewHolder.style.marginTop = '10px';
        var keepOpen = state.historyOpenAttemptId === a.id || state.disputingAnswerIndex === ('hist-'+a.id+'-'+0);
        toggleBtn.onclick = function(){
          var showing = reviewHolder.style.display !== 'none';
          reviewHolder.style.display = showing ? 'none' : 'block';
          state.historyOpenAttemptId = showing ? null : a.id;
          toggleBtn.textContent = showing ? 'View questions & answers' : 'Hide questions & answers';
        };
        if(published){
          (a.answers||[]).forEach(function(ans, idx){
            reviewHolder.appendChild(renderAnswerReviewBlock(a, ans, idx, 'hist-'+a.id));
          });
          if(state.disputingAnswerIndex && state.disputingAnswerIndex.indexOf('hist-'+a.id+'-')===0){ state.historyOpenAttemptId=a.id; }
          if(state.historyOpenAttemptId === a.id){
            reviewHolder.style.display='block';
            toggleBtn.textContent='Hide questions & answers';
          }
          block.appendChild(toggleBtn);
          block.appendChild(reviewHolder);
        }
        listHolder.appendChild(block);
      });
    }
    renderHistoryList();
    wrap.appendChild(card);
    return wrap;
  }

      }; img.src=ev.target.result;}; reader.readAsDataURL(file);
    }
    avatarInput.onchange=function(e){processImage(e.target.files&&e.target.files[0],false);avatarInput.value='';};
    return wrap;
  }

  /* ================= USER: CHANGE PASSWORD ================= */
  function renderChangePassword(){
    var wrap = document.createElement('div');
    var card = document.createElement('div');
    card.className = 'card';
    card.style.maxWidth = '420px';
    card.innerHTML = '<div class="section-title">Change your password</div>';

    if(state.changePwError){
      var err = document.createElement('div'); err.className = 'login-error'; err.textContent = state.changePwError;
      card.appendChild(err);
    }
    if(state.changePwSuccess){
      var ok = document.createElement('div');
      ok.style.cssText = 'background:var(--green-bg);color:var(--green);font-size:12px;padding:9px 12px;border-radius:8px;margin-bottom:14px;';
      ok.textContent = 'Your password has been updated.';
      card.appendChild(ok);
    }
    var curInput = document.createElement('input'); curInput.type = 'password';
    var newInput = document.createElement('input'); newInput.type = 'password';
    var confirmInput = document.createElement('input'); confirmInput.type = 'password';
    function row(labelText, el){
      var r = document.createElement('div'); r.className = 'form-row';
      var l = document.createElement('label'); l.textContent = labelText;
      r.appendChild(l); r.appendChild(el);
      return r;
    }
    card.appendChild(row('Current password', curInput));
    card.appendChild(row('New password', newInput));
    card.appendChild(row('Confirm new password', confirmInput));

    var saveBtn = document.createElement('button');
    saveBtn.className = 'btn primary';
    saveBtn.textContent = 'Update password';
    saveBtn.onclick = function(){
      var user = currentUser();
      if(curInput.value !== user.password){ state.changePwError = 'Your current password is incorrect.'; state.changePwSuccess = false; render(); return; }
      if(!newInput.value || newInput.value.length < 6){ state.changePwError = 'New password must be at least 6 characters.'; state.changePwSuccess = false; render(); return; }
      if(newInput.value !== confirmInput.value){ state.changePwError = 'New password and confirmation do not match.'; state.changePwSuccess = false; render(); return; }
      user.password = newInput.value; user.mustChangePassword = false;
      state.changePwError = ''; state.changePwSuccess = true;
      saveData(); render();
    };
    card.appendChild(saveBtn);
    wrap.appendChild(card);
    return wrap;
  }

  /* ================= QUIZ TAKING ================= */
  async function openQuiz(quiz){
    if(quizStatus(quiz)!=='running'){ notify(quizStatus(quiz)==='scheduled'?'This quiz has not started yet.':'This quiz has ended.','error'); return; }
    var userId = state.currentUserId;
    // Supabase quiz_attempts is authoritative. If the DB row was deleted,
    // the quiz must be allowed again even if an old local/meta completion flag exists.
    var alreadyAttempted = await remoteQuizAttemptExists(userId, quiz.id);
    if(alreadyAttempted){
      notify('You have already completed this quiz.','error');
      return;
    }

    var qs = {
      quiz: quiz,
      questions: quiz.questionIds.map(function(id){ return state.data.questionBank.find(function(q){return q.id===id;}); }).filter(Boolean),
      index: 0, selections: {}, done: false,
      startedAt: Date.now(), deadline: Math.min(Date.now() + quiz.durationMinutes*60000, quizEndMs(quiz)),
      attemptId: null
    };
    state.quizSession = qs;
    render();
  }

  var quizTimerInterval = null;
  function startQuizModalTimer(){
    if(quizTimerInterval) clearInterval(quizTimerInterval);
    function tick(){
      var el = document.getElementById('quizTimer');
      var qs = state.quizSession;
      if(!el || !qs || qs.done){ clearInterval(quizTimerInterval); return; }
      var diff = Math.max(0, qs.deadline - Date.now());
      var m = Math.floor(diff/60000);
      var s = Math.floor((diff%60000)/1000);
      function p(n){ return n<10 ? '0'+n : ''+n; }
      el.textContent = m+':'+p(s);
      el.classList.toggle('low', diff <= 30000);
      if(diff <= 0){
        clearInterval(quizTimerInterval);
        finishQuiz();
      }
    }
    tick();
    quizTimerInterval = setInterval(tick, 1000);
  }

  function renderQuizModal(){
    var overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    var box = document.createElement('div');
    box.className = 'modal-box';
    var qs = state.quizSession;

    if(!qs.done){
      var head = document.createElement('div');
      head.className = 'modal-head';
      head.innerHTML = '<div class="modal-title">'+escapeHtml(qs.quiz.title)+'</div><span class="quiz-timer" id="quizTimer"></span>';
      box.appendChild(head);
      startQuizModalTimer();

      var optionButtons = [];
      var dotButtons = [];
      var refreshQuizQuestionInPlace = function(){
        var currentQ=qs.questions[qs.index];
        progress.textContent = 'Question ' + (qs.index+1) + ' of ' + qs.questions.length;
        qEl.textContent=currentQ.question;
        optionButtons.forEach(function(btn,i){ btn.textContent=currentQ.options[i]||''; btn.classList.toggle('selected',qs.selections[qs.index]===i); });
        dotButtons.forEach(function(dot,i){ dot.classList.toggle('current',i===qs.index); dot.classList.toggle('answered',qs.selections[i]!==undefined); });
        prevBtn.disabled=qs.index===0;
        var last=qs.index===qs.questions.length-1; nextBtn.textContent=last?'Submit quiz':'Next →';
      };

      var dots = document.createElement('div');
      dots.className = 'quiz-dots';
      qs.questions.forEach(function(q, i){
        var dot = document.createElement('div');
        dot.className = 'quiz-dot' + (i===qs.index?' current':'') + (qs.selections[i]!==undefined?' answered':'');
        dot.textContent = i+1;
        dot.onclick = function(){ qs.index = i; refreshQuizQuestionInPlace(); };
        dotButtons.push(dot); dots.appendChild(dot);
      });
      box.appendChild(dots);

      var progress = document.createElement('div');
      progress.className = 'quiz-progress';
      progress.textContent = 'Question ' + (qs.index+1) + ' of ' + qs.questions.length;
      box.appendChild(progress);

      var q = qs.questions[qs.index];
      var qEl = document.createElement('div');
      qEl.className = 'quiz-question';
      qEl.textContent = q.question;
      box.appendChild(qEl);

      q.options.forEach(function(opt, i){
        var b = document.createElement('button');
        b.className = 'quiz-option' + (qs.selections[qs.index]===i ? ' selected' : '');
        b.textContent = opt;
        optionButtons.push(b);
        b.onclick = function(){
          qs.selections[qs.index] = i;
          var opts = box.querySelectorAll('.quiz-option');
          opts.forEach(function(el, idx){ el.classList.toggle('selected', idx === i); });
          dots.querySelectorAll('.quiz-dot').forEach(function(el, idx){
            if(idx === qs.index) el.classList.add('answered');
          });
        };
        box.appendChild(b);
      });

      var navRow = document.createElement('div');
      navRow.className = 'quiz-nav-row';
      var prevBtn = document.createElement('button');
      prevBtn.className = 'btn secondary'; prevBtn.textContent = '\u2190 Previous';
      prevBtn.disabled = qs.index === 0;
      prevBtn.onclick = function(){ if(qs.index>0){ qs.index -= 1; refreshQuizQuestionInPlace(); } };
      navRow.appendChild(prevBtn);

      var isLast = qs.index === qs.questions.length - 1;
      var nextBtn = document.createElement('button');
      nextBtn.className = 'btn primary';
      nextBtn.textContent = isLast ? 'Submit quiz' : 'Next \u2192';
      nextBtn.onclick = function(){
        var lastNow = qs.index === qs.questions.length - 1;
        if(lastNow){
          var unanswered = qs.questions.length - Object.keys(qs.selections).length;
          if(unanswered > 0){
            if(!confirm(unanswered + ' question(s) are still unanswered. Submit anyway?')) return;
          }
          nextBtn.disabled = true;
          nextBtn.textContent = 'Submitting...';
          finishQuiz().finally(function(){ if(state.quizSession && !state.quizSession.done) { nextBtn.disabled=false; nextBtn.textContent='Submit quiz'; } });
        }else{
          qs.index += 1; refreshQuizQuestionInPlace();
        }
      };
      navRow.appendChild(nextBtn);
      box.appendChild(navRow);

      var submitNowBtn = document.createElement('button');
      submitNowBtn.className = 'btn secondary small';
      submitNowBtn.style.marginTop = '10px';
      submitNowBtn.textContent = 'Submit quiz now';
      submitNowBtn.onclick = function(){
        var unanswered = qs.questions.length - Object.keys(qs.selections).length;
        var msg = unanswered > 0 ? unanswered + ' question(s) are still unanswered. Submit anyway?' : 'Submit the quiz now?';
        if(!confirm(msg)) return;
        submitNowBtn.disabled = true;
        submitNowBtn.textContent = 'Submitting...';
        finishQuiz().finally(function(){ if(state.quizSession && !state.quizSession.done) { submitNowBtn.disabled=false; submitNowBtn.textContent='Submit quiz now'; } });
      };
      box.appendChild(submitNowBtn);
    }else{
      var user = currentUser();
      var head2 = document.createElement('div');
      head2.className = 'modal-head';
      head2.innerHTML = '<div class="modal-title">Quiz complete</div>';
      box.appendChild(head2);
      var result = document.createElement('div');
      result.className = 'quiz-result';
      result.innerHTML = '<div class="score">'+qs.finalScore+' / '+qs.questions.length+'</div><div style="font-size:12px;color:var(--text-dim);margin-top:8px;">Your result has been saved. You can review it anytime under My History.</div>';
      box.appendChild(result);

      var reviewTitle = document.createElement('div');
      reviewTitle.className = 'section-title';
      reviewTitle.textContent = 'Review your answers';
      box.appendChild(reviewTitle);

      var attempt = state.data.quizAttempts.find(function(a){return a.id===qs.attemptId;});
      if(attempt){
        attempt.answers.forEach(function(ans, idx){
          box.appendChild(renderAnswerReviewBlock(attempt, ans, idx, 'live-'+attempt.id));
        });
      }

      var doneBtn = document.createElement('button');
      doneBtn.className = 'btn primary'; doneBtn.style.marginTop = '6px'; doneBtn.textContent = 'Close';
      doneBtn.onclick = function(){ state.quizSession = null; state.disputingAnswerIndex = null; state.tab = 'history'; render(); };
      box.appendChild(doneBtn);
    }
    overlay.appendChild(box);
    return overlay;
  }

  async function finishQuiz(){
    var qs = state.quizSession;
    if(qs.done) return;

    var user = currentUser();

    // Prevent duplicate submission using the locally loaded attempts.
    // Final no-retake check is also DB-authoritative. Deleting the attempt
    // from Supabase therefore immediately removes the block.
    var duplicateAttempt = await remoteQuizAttemptExists(state.currentUserId, qs.quiz.id);
    if(duplicateAttempt){
      qs.done = true;
      state.quizSession = null;
      notify('You have already completed this quiz.','error');
      render();
      return;
    }

    var score = 0;
    var answers = qs.questions.map(function(q, i){
      var selIndex = qs.selections[i];
      var hasSelection = selIndex !== undefined;
      var isCorrect = hasSelection && isAnswerAccepted(q, selIndex);
      if(isCorrect) score += 1;
      return {
        questionId: q.id, questionText: q.question, options: q.options,
        selectedIndex: hasSelection ? selIndex : -1,
        correctIndex: q.correctIndex,
        selectedOption: hasSelection ? q.options[selIndex] : 'No answer given',
        correctOption: q.options[q.correctIndex],
        isCorrect: isCorrect
      };
    });
    var attempt = {
      id: uid(), quizId: qs.quiz.id, quizTitle: qs.quiz.title, quizDate: qs.quiz.scheduledDate,
      userId: state.currentUserId, userName: user.name, userEmail: user.email, team: user.team,
      score: score, total: qs.questions.length, date: new Date().toISOString().slice(0,10),
      finishedAt: Date.now(), answers: answers
    };
    // IMPORTANT: save to Supabase first. Only after the database confirms the
    // attempt exists do we mark the quiz complete locally and show the result.
    try{
      await saveQuizAttemptDirect(attempt);

      if(!state.data.quizAttempts.some(function(a){ return a && a.id === attempt.id; })){
        state.data.quizAttempts.push(attempt);
      }
      if(!state.data.userCompletedQuizzes[state.currentUserId]) state.data.userCompletedQuizzes[state.currentUserId] = [];
      if(state.data.userCompletedQuizzes[state.currentUserId].indexOf(qs.quiz.id) === -1){
        state.data.userCompletedQuizzes[state.currentUserId].push(qs.quiz.id);
      }
      markLocalCompletion(state.currentUserId, qs.quiz.id);
      // Persist the completion index separately; quiz_attempts itself is already
      // verified above, so a meta write failure cannot erase the real attempt.
      try{ await saveMetaKey('userCompletedQuizzes', state.data.userCompletedQuizzes); }catch(metaErr){ console.warn('Completion index save failed:', metaErr); }

      qs.attemptId = attempt.id;
      qs.finalScore = score;
      qs.done = true;
      qs.submitted = true;
      state.quizSession = null;
      state.tab = 'history';
      render();
      notify('Quiz submitted successfully. Your result has been saved.','success');
    }catch(e){
      console.error('Quiz completion persistence error:', e);
      qs.done = false;
      notify('Quiz result was NOT saved. Please try Submit again. '+e.message,'error');
      render();
    }
  }

  loadData();
})();
</script>
