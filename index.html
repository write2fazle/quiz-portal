<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Portal</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root{
  --navy:#1B2A4A;
  --navy-dim:#2B3E63;
  --orange:#F46B12;
  --orange-dim:#F79A5C;
  --orange-dark:#C6540C;
  --bg:#F5F6F8;
  --surface:#FFFFFF;
  --surface-2:#F0F2F5;
  --line:#E3E6EB;
  --text:#1F2430;
  --text-dim:#6B7280;
  --text-mute:#9CA3AF;
  --green:#2F9E58;
  --green-bg:#E7F6EC;
  --red:#D64545;
  --red-bg:#FBE9E9;
  --blue:#2F6FE0;
  --blue-bg:#E9F0FE;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;width:100%;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
button,select,input,textarea{font-family:'Inter',sans-serif;}
button{cursor:pointer;}

.shell{width:100%;max-width:1160px;margin:0 auto;padding:20px 20px 60px;}

/* ---- top bar ---- */
.topbar{display:flex;align-items:center;gap:16px;background:var(--navy);color:#fff;border-radius:12px;padding:14px 20px;margin-bottom:20px;}
.brand{font-weight:700;font-size:17px;display:flex;align-items:center;gap:10px;}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--orange);}
.top-user{display:flex;align-items:center;gap:12px;margin-left:auto;font-size:13px;}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--orange);color:#fff;font-weight:600;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.role-pill{font-size:10px;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,0.15);margin-left:6px;}
.logout-btn{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);color:#fff;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;}
.logout-btn:hover{background:rgba(255,255,255,0.25);}

/* ---- login ---- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:36px 34px;width:100%;max-width:380px;box-shadow:0 12px 40px rgba(20,25,40,0.08);}
.login-logo{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:6px;}
.login-logo img{width:84px;height:84px;border-radius:16px;object-fit:cover;}
.login-logo span{font-weight:700;font-size:19px;color:var(--navy);}
.login-sub{font-size:13px;color:var(--text-dim);margin-bottom:24px;text-align:center;}
.login-error{background:var(--red-bg);color:var(--red);font-size:12px;padding:9px 12px;border-radius:8px;margin-bottom:14px;}
.login-note{font-size:11px;color:var(--text-mute);margin-top:18px;line-height:1.6;text-align:center;}
.remember-row{display:flex;align-items:center;gap:8px;margin:-4px 0 16px;}
.remember-row label{font-size:12px;color:var(--text-dim);}

/* ---- tabs ---- */
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
.tab-btn{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:9px 18px;font-size:13px;color:var(--text-dim);font-weight:500;}
.tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.tab-btn:hover:not(.active){border-color:var(--orange-dim);color:var(--text);}
.subtabs{display:flex;gap:6px;margin-bottom:16px;}
.subtab-btn{background:none;border:none;padding:8px 4px;font-size:13px;color:var(--text-dim);border-bottom:2px solid transparent;font-weight:500;}
.subtab-btn.active{color:var(--orange);border-bottom-color:var(--orange);}

/* ---- cards ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:16px;}
.section-title{font-size:13px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.3px;margin-bottom:14px;}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center;}
.stat-icon{font-size:20px;margin-bottom:4px;}
.stat-num{font-size:24px;font-weight:700;color:var(--navy);font-family:'JetBrains Mono',monospace;}
.stat-lbl{font-size:11px;color:var(--text-dim);margin-top:2px;}
.empty-note{text-align:center;color:var(--text-mute);font-size:13px;padding:26px 10px;}

/* ---- forms ---- */
.form-row{margin-bottom:14px;}
.form-row label{display:block;font-size:11px;color:var(--text-dim);margin-bottom:6px;letter-spacing:0.2px;}
.form-row input[type=text],.form-row input[type=email],.form-row input[type=password],.form-row input[type=number],.form-row select,.form-row input[type=date],.form-row input[type=time],.form-row textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--text);
}
.form-row input:focus,.form-row select:focus{outline:none;border-color:var(--orange-dim);}
.btn{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:13px;font-weight:600;}
.btn:hover{background:var(--navy-dim);}
.btn.primary{background:var(--orange);}
.btn.primary:hover{background:var(--orange-dark);}
.btn.secondary{background:none;border:1px solid var(--line);color:var(--text);}
.btn.secondary:hover{border-color:var(--orange-dim);color:var(--orange);}
.btn.danger{background:none;border:1px solid var(--red);color:var(--red);}
.btn.danger:hover{background:var(--red-bg);}
.btn.small{padding:6px 12px;font-size:11px;}
.btn:disabled{opacity:0.5;cursor:not-allowed;}
.btn-full{width:100%;padding:11px;font-size:14px;}

table.data-table{width:100%;border-collapse:collapse;font-size:13px;}
table.data-table th{text-align:left;font-size:11px;color:var(--text-mute);text-transform:uppercase;letter-spacing:0.3px;padding:9px 10px;border-bottom:1px solid var(--line);}
table.data-table td{padding:10px 10px;border-bottom:1px solid var(--line);}
table.data-table tr:last-child td{border-bottom:none;}
.role-badge{font-size:10px;padding:3px 9px;border-radius:10px;font-weight:600;}
.role-badge.admin{background:var(--red-bg);color:var(--red);}
.role-badge.user{background:var(--green-bg);color:var(--green);}
.role-badge.leader{background:var(--blue-bg);color:var(--blue);}
.role-badge.management{background:#F1E9FC;color:#7B3FE4;}
.status-badge{font-size:10px;padding:3px 9px;border-radius:10px;font-weight:600;}
.status-badge.running{background:var(--green-bg);color:var(--green);}
.status-badge.scheduled{background:#FFF1E4;color:var(--orange);}
.status-badge.off{background:var(--surface-2);color:var(--text-mute);}

/* ---- quiz list / taking ---- */
.quiz-list-row{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;}
.quiz-list-title{font-size:14px;font-weight:600;}
.quiz-list-meta{font-size:11px;color:var(--text-dim);margin-top:3px;}
.quiz-progress{font-size:11px;color:var(--text-mute);margin-bottom:6px;}
.quiz-dots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.quiz-dot{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);}
.quiz-dot.current{border-color:var(--orange);color:var(--orange);font-weight:700;}
.quiz-dot.answered{background:var(--navy);color:#fff;border-color:var(--navy);}
.quiz-dot.answered.current{background:var(--orange);border-color:var(--orange);}
.quiz-question{font-size:16px;font-weight:600;margin-bottom:16px;line-height:1.5;}
.quiz-option{display:block;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:13px;margin-bottom:9px;color:var(--text);}
.quiz-option:hover{border-color:var(--orange-dim);}
.quiz-option.selected{border-color:var(--orange);background:#FFF1E4;color:var(--orange-dark);font-weight:600;}
.quiz-nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:8px;}
.quiz-result{text-align:center;padding:24px 10px;}
.quiz-result .score{font-size:40px;font-weight:700;color:var(--orange);font-family:'JetBrains Mono',monospace;}
.quiz-timer{background:var(--orange);color:#fff;font-size:12px;padding:4px 10px;border-radius:10px;font-family:'JetBrains Mono',monospace;}
.quiz-timer.low{background:var(--red);}

/* ---- podium ---- */
.podium{display:flex;justify-content:center;align-items:flex-end;gap:20px;margin-bottom:22px;flex-wrap:wrap;}
.podium-slot{display:flex;flex-direction:column;align-items:center;text-align:center;width:120px;}
.podium-photo-wrap{position:relative;margin-bottom:10px;}
.podium-photo{border-radius:50%;object-fit:cover;border:3px solid var(--orange);background:var(--surface-2);}
.podium-photo-placeholder{border-radius:50%;background:var(--surface-2);border:3px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--text-mute);font-weight:700;}
.podium-rank-badge{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);background:var(--orange);color:#fff;font-size:11px;font-weight:700;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #fff;}
.podium-slot.rank1 .podium-photo,.podium-slot.rank1 .podium-photo-placeholder{width:100px;height:100px;font-size:32px;border-color:#F4B740;}
.podium-slot.rank1 .podium-rank-badge{background:#F4B740;}
.podium-slot.rank2 .podium-photo,.podium-slot.rank2 .podium-photo-placeholder{width:80px;height:80px;font-size:26px;border-color:#B7BEC7;}
.podium-slot.rank2 .podium-rank-badge{background:#9AA3AF;}
.podium-slot.rank3 .podium-photo,.podium-slot.rank3 .podium-photo-placeholder{width:80px;height:80px;font-size:26px;border-color:#D79A6B;}
.podium-slot.rank3 .podium-rank-badge{background:#C9803F;}
.podium-name{font-size:13px;font-weight:700;margin-top:2px;}
.podium-team{font-size:11px;color:var(--text-dim);}
.podium-score{font-size:12px;color:var(--orange);font-weight:700;margin-top:2px;font-family:'JetBrains Mono',monospace;}

/* ---- charts ---- */
.chart-row{display:flex;gap:16px;flex-wrap:wrap;}
.chart-box{flex:1;min-width:220px;}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12px;}
.bar-label{width:130px;flex:none;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-track{flex:1;background:var(--surface-2);border-radius:6px;height:14px;overflow:hidden;}
.bar-fill{height:100%;background:var(--orange);border-radius:6px;}
.bar-value{width:44px;flex:none;text-align:right;font-family:'JetBrains Mono',monospace;color:var(--text-dim);}
.legend-row{display:flex;align-items:center;gap:6px;font-size:12px;margin-top:6px;}
.legend-dot{width:10px;height:10px;border-radius:50%;flex:none;}

/* ---- review blocks ---- */
.review-block{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;}
.review-q{font-size:13px;font-weight:600;margin-bottom:6px;}
.review-a{font-size:12px;color:var(--text-dim);}
.review-remark{font-size:11px;color:var(--green);margin-top:6px;}

/* ---- history filters ---- */
.filter-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:flex-end;}

.ku-toolbar-row{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.ku-search-box{flex:1;min-width:220px;}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}
.status-dot.on{background:var(--green);}
.status-dot.off{background:var(--text-mute);}
.icon-btn{width:30px;height:30px;border-radius:6px;border:none;color:#fff;font-size:13px;display:inline-flex;align-items:center;justify-content:center;margin-right:4px;}
.icon-btn.view{background:#1AA6B7;}
.icon-btn.edit{background:var(--orange);}
.icon-btn.delete{background:var(--red);}
.rte-mini-toolbar{display:flex;gap:4px;flex-wrap:wrap;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;background:var(--surface-2);padding:6px;}
.rte-mini-btn{background:none;border:1px solid transparent;border-radius:5px;padding:5px 9px;font-size:12px;color:var(--text);min-width:28px;}
.rte-mini-btn:hover{background:var(--surface);border-color:var(--line);}
.rte-mini-editor{border:1px solid var(--line);border-radius:0 0 8px 8px;min-height:160px;padding:12px 14px;font-size:13px;line-height:1.6;background:var(--surface);}
.rte-mini-editor:focus{outline:none;border-color:var(--orange-dim);}
.rte-mini-editor:empty:before{content:attr(data-placeholder);color:var(--text-mute);}
.ku-content-view{font-size:13px;line-height:1.7;}
.ku-content-view img{max-width:100%;}

.admin-menu-wrap{position:relative;}
.admin-menu-btn{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);color:#fff;border-radius:6px;width:30px;height:30px;font-size:16px;display:flex;align-items:center;justify-content:center;}
.admin-menu-btn:hover{background:rgba(255,255,255,0.22);}
.admin-menu-panel{position:absolute;top:calc(100% + 8px);left:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,0.16);padding:6px;min-width:200px;z-index:90;display:none;}
.admin-menu-panel.open{display:block;}
.admin-menu-item{display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:13px;color:var(--text);border-radius:6px;cursor:pointer;white-space:nowrap;}
.admin-menu-item:hover{background:var(--surface-2);}
.admin-menu-item.active{background:var(--surface-2);color:var(--orange);font-weight:600;}
.admin-menu-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;}
.filter-row .form-row{margin-bottom:0;flex:1;min-width:160px;}

/* ---- modal ---- */
.modal-overlay{position:fixed;inset:0;background:rgba(20,25,40,0.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;}
.modal-box{background:var(--surface);border-radius:12px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;padding:22px 24px;}
.modal-box.wide{max-width:820px;}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.modal-close{background:none;border:none;font-size:18px;color:var(--text-mute);}
.modal-close:hover{color:var(--text);}
.modal-title{font-size:17px;font-weight:700;margin:0;}

@media(max-width:640px){
  .stat-grid{grid-template-columns:1fr 1fr;}
}
/* ---- fixed sidebar / fluid workspace ---- */
.app-layout{min-height:100vh;width:100%;}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:258px;background:#FFFFFF;color:#344054;border-right:1px solid rgba(255,255,255,.07);z-index:200;display:flex;flex-direction:column;transition:width .25s ease,transform .25s ease;box-shadow:10px 0 30px rgba(0,0,0,.10);}
.sidebar.collapsed{width:76px;}
.sidebar-brand{height:72px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.07);flex:none;}
.sidebar-brand-mark{width:36px;height:36px;border-radius:10px;background:var(--orange);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;box-shadow:0 5px 18px rgba(244,107,18,.25);flex:none;}
.sidebar-brand-text{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;}
.sidebar.collapsed .sidebar-brand{justify-content:center;padding:0 10px;}
.sidebar.collapsed .sidebar-brand-text{display:none;}
.sidebar-nav{padding:16px 12px;overflow-y:auto;flex:1;}
.sidebar-section-label{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#6B7280;padding:4px 10px 9px;}
.sidebar-item{width:100%;display:flex;align-items:center;gap:12px;border:0;background:transparent;color:#9CA3AF;border-radius:9px;padding:10px 11px;margin-bottom:3px;font-size:13px;font-weight:500;text-align:left;transition:background .18s ease,color .18s ease,transform .18s ease;position:relative;}
.sidebar-item:hover{background:#F8FAFC;color:#F9FAFB;}
.sidebar-item.active{background:rgba(244,107,18,.14);color:#FDBA74;font-weight:600;}
.sidebar-item.active:before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 4px 4px 0;background:var(--orange);}
.sidebar-icon{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:16px;}
.sidebar-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sidebar-badge{margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#DC2626;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;}
.sidebar.collapsed .sidebar-section-label,.sidebar.collapsed .sidebar-label,.sidebar.collapsed .sidebar-badge{display:none;}
.sidebar.collapsed .sidebar-item{justify-content:center;padding:10px 8px;}
.sidebar.collapsed .sidebar-item.active:before{left:0;}
.sidebar-footer{padding:12px;border-top:1px solid rgba(255,255,255,.07);flex:none;}
.sidebar-user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:9px;background:rgba(255,255,255,.04);margin-bottom:8px;overflow:hidden;}
.sidebar-user-info{min-width:0;flex:1;}
.sidebar-user-name{font-size:12px;font-weight:600;color:#F3F4F6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sidebar-user-role{font-size:10px;color:#6B7280;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sidebar.collapsed .sidebar-user{justify-content:center;padding:7px 3px;}
.sidebar.collapsed .sidebar-user-info{display:none;}
.sidebar-toggle{width:100%;height:36px;border:1px solid rgba(255,255,255,.08);background:#F8FAFC;color:#9CA3AF;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;}
.sidebar-toggle:hover{background:#273449;color:#fff;}
.sidebar.collapsed .sidebar-toggle span{display:none;}
.workspace{margin-left:258px;min-height:100vh;width:calc(100% - 258px);transition:margin-left .25s ease,width .25s ease;}
.workspace.collapsed{margin-left:76px;width:calc(100% - 76px);}
.mobile-sidebar-overlay{display:none;}

/* ---- top bar ---- */
.topbar{display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;border-radius:0;padding:14px 22px;margin:0 0 20px;min-height:64px;position:sticky;top:0;z-index:100;}
.topbar-page-title{font-size:14px;font-weight:600;color:#fff;}
.topbar-toggle{width:36px;height:36px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:18px;}
.topbar-toggle:hover{background:rgba(255,255,255,.16);}
.brand{font-weight:700;font-size:17px;display:flex;align-items:center;gap:10px;}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--orange);}
.top-user{display:flex;align-items:center;gap:12px;margin-left:auto;font-size:13px;}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--orange);color:#fff;font-weight:600;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.role-pill{font-size:10px;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,0.15);margin-left:6px;}
.logout-btn{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);color:#fff;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;}
.logout-btn:hover{background:rgba(255,255,255,0.25);}


/* Minimalist flat vector sidebar icons */
.sidebar-icon{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;flex:0 0 22px;line-height:1}
.sidebar-svg-icon{width:20px;height:20px;display:block;stroke:currentColor;fill:none;vector-effect:non-scaling-stroke}
.sidebar-item.active .sidebar-svg-icon,.sidebar-item:hover .sidebar-svg-icon{stroke:currentColor}

/* ===== Screenshot-matched light premium navigation ===== */
.shell{width:100%;max-width:none;margin:0;padding:0 28px 60px;}
.sidebar{width:270px;background:#fff;color:#344054;border-right:1px solid #E4E7EC;box-shadow:2px 0 12px rgba(16,24,40,.04);}
.sidebar.collapsed{width:76px;}
.sidebar-brand{height:64px;padding:0 18px;border-bottom:1px solid #F0F2F5;}
.sidebar-brand-mark{width:36px;height:36px;border-radius:10px;background:#F46B12;box-shadow:0 5px 18px rgba(244,107,18,.20);}
.sidebar-brand-text{font-size:15px;color:#1D2939;}
.sidebar-nav{padding:24px 12px 12px;}
.sidebar-section-label{color:#98A2B3;font-size:9px;letter-spacing:.14em;padding:4px 10px 10px;}

<script>
(function(){

  /* ================= HELPERS ================= */
  function escapeHtml(s){
    var div = document.createElement('div');
    div.textContent = s == null ? '' : String(s);
    return div.innerHTML;
  }
  function uid(){ return Math.random().toString(36).slice(2,10); }
  function fmtDate(d){
    var dt = new Date(d);
    var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return months[dt.getMonth()]+' '+dt.getDate()+', '+dt.getFullYear();
  }
  function fmtDateTime(ts){
    var dt = new Date(ts);
    var h = dt.getHours();
    var ampm = h >= 12 ? 'PM' : 'AM';
    var h12 = h % 12; if(h12 === 0) h12 = 12;
    var mins = dt.getMinutes();
    var minsStr = mins < 10 ? '0'+mins : ''+mins;
    return fmtDate(dt) + ' ' + h12 + ':' + minsStr + ' ' + ampm;
  }
  function shuffleArr(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }
  function resizeImageToSquare(file, size, cb){
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        var side = Math.min(img.width, img.height);
        var sx = (img.width - side) / 2;
        var sy = (img.height - side) / 2;
        var canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
        cb(canvas.toDataURL('image/jpeg', 0.9));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }
  function downloadCSV(filename, headerRow, rows){
    var csv = [headerRow].concat(rows).map(function(row){
      return row.map(function(cell){
        var v = String(cell==null?'':cell).replace(/"/g,'""');
        return '"'+v+'"';
      }).join(',');
    }).join('\r\n');
    var BOM = '\uFEFF'; // ensures Excel renders Bangla (and other non-Latin) text correctly
    var blob = new Blob([BOM + csv], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  /* ================= SIMPLE CHARTS (no external library) ================= */
  function buildDonutSVG(segments, size){
    size = size || 140;
    var total = segments.reduce(function(s,x){return s+x.value;}, 0);
    if(total <= 0){
      return '<div class="empty-note">No data yet.</div>';
    }
    var r = size/2 - 14;
    var cx = size/2, cy = size/2;
    var circumference = 2 * Math.PI * r;
    var offset = 0;
    var circles = segments.map(function(seg){
      var frac = seg.value / total;
      var dash = frac * circumference;
      var circle = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+seg.color+'" stroke-width="20" '+
        'stroke-dasharray="'+dash+' '+(circumference-dash)+'" stroke-dashoffset="'+(-offset)+'" transform="rotate(-90 '+cx+' '+cy+')"/>';
      offset += dash;
      return circle;
    }).join('');
    var svg = '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'">'+circles+
      '<text x="'+cx+'" y="'+(cy+5)+'" text-anchor="middle" font-size="16" font-weight="700" fill="var(--text)" font-family="JetBrains Mono, monospace">'+Math.round((segments[0].value/total)*100)+'%</text>'+
      '</svg>';
    var legend = segments.map(function(seg){
      return '<div class="legend-row"><span class="legend-dot" style="background:'+seg.color+';"></span>'+escapeHtml(seg.label)+' ('+seg.value+')</div>';
    }).join('');
    return '<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;"><div>'+svg+'</div><div>'+legend+'</div></div>';
  }
  function buildBarList(bars){
    if(bars.length === 0) return '<div class="empty-note">No data yet.</div>';
    var max = Math.max.apply(null, bars.map(function(b){return b.value;}).concat([1]));
    return bars.map(function(b){
      var pct = Math.round((b.value/max)*100);
      return '<div class="bar-row"><div class="bar-label" title="'+escapeHtml(b.label)+'">'+escapeHtml(b.label)+'</div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;"></div></div>'+
        '<div class="bar-value">'+b.value+'%</div></div>';
    }).join('');
  }

  /* ================= DATA MODEL ================= */
  var DEFAULT_TEAMS = ['Inbound','Recurring','Telesales','Welcome','Complaint Management'];
  var ROLES = ['User','Team Leader','Management','Admin'];

  function defaultData(){
    var adminId = uid(), leaderId = uid(), user1Id = uid(), user2Id = uid(), mgmtId = uid();
    var q1=uid(), q2=uid(), q3=uid(), q4=uid(), q5=uid();
    return {
      teams: DEFAULT_TEAMS.slice(),
      users: [
        {id:adminId, name:'System Admin', email:'admin@guardianlife.com', password:'admin123', role:'Admin', team:null, mustChangePassword:false, photo:null},
        {id:leaderId, name:'Musfiq Bhai', email:'leader@guardianlife.com', password:'welcome123', role:'Team Leader', team:'Inbound', mustChangePassword:true, photo:null},
        {id:mgmtId, name:'Quality Team', email:'quality@guardianlife.com', password:'welcome123', role:'Management', team:null, mustChangePassword:true, photo:null},
        {id:user1Id, name:'Rahat Hossain', email:'rahat@guardianlife.com', password:'welcome123', role:'User', team:'Inbound', mustChangePassword:true, photo:null},
        {id:user2Id, name:'Sadia Karim', email:'sadia@guardianlife.com', password:'welcome123', role:'User', team:'Telesales', mustChangePassword:true, photo:null}
      ],
      questionBank: [
        {id:q1, team:'Inbound', question:'What is the standard turnaround time mentioned in the retail loan guideline?', options:['Same day','As set in the guideline','No fixed time','Only on weekends'], correctIndex:1, acceptedIndexes:[1]},
        {id:q2, team:'Inbound', question:'Bancassurance product updates are reviewed on what basis?', options:['Daily','Quarterly','Yearly only','Never'], correctIndex:1, acceptedIndexes:[1]},
        {id:q3, team:'Telesales', question:'What does KYC stand for?', options:['Keep Your Cash','Know Your Customer','Key Yield Calculation','Know Your Contract'], correctIndex:1, acceptedIndexes:[1]},
        {id:q4, team:'Telesales', question:'Who approves access to operational tools?', options:['Any employee','The approval chain for the access tier','No approval needed','Only IT'], correctIndex:1, acceptedIndexes:[1]},
        {id:q5, team:'Complaint Management', question:'Delayed claims should follow what process?', options:['No process','The escalation path','A public complaint','Ignore it'], correctIndex:1, acceptedIndexes:[1]}
      ],
      teamUsedQuestionIds: {},
      quizzes: [],
      quizAttempts: [],
      disputes: [],
      userCompletedQuizzes: {},
      userLogins: {},
      knowledgeUpdates: [],
      userSeenKnowledgeUpdates: {},
      userKnowledgeDashboardViews: {}
    };
  }

  var state = {
    data: null,
    lastSyncedData: null,
    currentUserId: null,
    tab: 'quiz',
    quizMgmtSubtab: 'bank',
    loginError: '',
    quizSession: null,
    editingUserId: null,
    editingQuestionId: null,
    editingQuizId: null,
    changePwError: '',
    changePwSuccess: false,
    disputingAnswerIndex: null,
    historySearchTitle: '',
    historySearchDate: '',
    reportsTeamFilter: '',
    reportsUserFilter: '',
    reportsStartDate: '',
    reportsEndDate: '',
    viewingAttemptId: null,
    historyOpenAttemptId: null,
    rememberChecked: true,
    kuMode: 'list',
    editingKuId: null,
    kuSearchName: '',
    kuGateIndex: 0,
    viewingKuId: null,
    viewingQuestionAuditId: null,
    adminMenuOpen: false,
    sidebarCollapsed: localStorage.getItem('quiz_sidebar_collapsed') === '1'
  };

  var SESSION_KEY = 'quiz-portal-session-v1';
  var SYNC_KEYS = ['teams','users','questionBank','quizzes','quizAttempts','disputes','knowledgeUpdates','teamUsedQuestionIds','userCompletedQuizzes','userSeenKnowledgeUpdates','userKnowledgeDashboardViews','userLogins'];

  // Session token only (which user is currently logged in on THIS device) —
  // fine to keep in the browser's own localStorage. No real data lives here,
  // so an Incognito window simply starts logged-out — it reads/writes the
  // exact same shared Google Sheet as every other session.
  function sessionGet(key){
    try{ return window.localStorage.getItem(key); }catch(e){ return null; }
  }
  function sessionSet(key, value){
    try{ window.localStorage.setItem(key, value); return true; }catch(e){ return false; }
  }

  /* ================= SUPABASE DATA BRIDGE ================= */
  // Vercel/static hosting cannot use google.script.run.
  // This bridge reads/writes the existing Supabase tables without changing
  // the rest of the Quiz Portal UI and business logic.
  var SUPABASE_URL = 'https://mpmkmmejjoubdakwsvak.supabase.co';
  var SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_ttF9g-dJMJk7dghB0mRTTA_GdSLt2AW';

  var SUPA_HEADERS = {
    'apikey': SUPABASE_PUBLISHABLE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_PUBLISHABLE_KEY,
    'Content-Type': 'application/json',
    'Prefer': 'return=representation'
  };

  function supaUrl(table, query){
    return SUPABASE_URL + '/rest/v1/' + table + (query || '');
  }

  async function supaRequest(url, options){
    options = options || {};
    options.headers = Object.assign({}, SUPA_HEADERS, options.headers || {});
    var response = await fetch(url, options);
    var text = await response.text();
    var body = null;
    try { body = text ? JSON.parse(text) : null; } catch(e) { body = text; }
    if(!response.ok){
      var msg = body && body.message ? body.message : text || ('HTTP ' + response.status);
      throw new Error('Supabase ' + response.status + ': ' + msg);
    }
    return body;
  }

  function parseJsonValue(v, fallback){
    if(v === null || v === undefined || v === '') return fallback;
    if(typeof v === 'object') return v;
    try { return JSON.parse(v); } catch(e) { return fallback; }
  }

  function clone(obj){ return JSON.parse(JSON.stringify(obj)); }

  async function readJsonCollection(table){
    var rows = await supaRequest(supaUrl(table, '?select=id,data,created_at,updated_at&order=created_at.asc'));
    return (rows || []).map(function(row){
      var obj = parseJsonValue(row.data, null);
      if(!obj || typeof obj !== 'object') obj = {id: row.id};
      if(!obj.id) obj.id = row.id;
      obj.dbRowId = row.id;
      return obj;
    });
  }

  async function readTeams(){
    // Current Supabase schema: public.teams(id uuid, name text, created_at timestamptz)
    var rows = await supaRequest(supaUrl('teams', '?select=id,name,created_at&order=name.asc'));
    return (rows || []).map(function(row){
      return row.name || '';
    }).filter(Boolean);
  }

  async function readUsers(){
    // Use select=* so this works with the current simple Users table
    // (id/name/created_at) without assuming a JSON data column.
    var rows = await supaRequest(supaUrl('users', '?select=*'));
    return (rows || []).map(function(row){
      if(row.data !== undefined && row.data !== null){
        var obj = parseJsonValue(row.data, {id: row.id});
        if(!obj.id) obj.id = row.id;
        return obj;
      }
      return {
        id: row.id,
        name: row.name || row.Name || '',
        email: row.email || '',
        password: row.password || '',
        role: row.role || 'User',
        team: row.team || null,
        mustChangePassword: !!row.mustChangePassword,
        photo: row.photo || null
      };
    });
  }

  async function readMeta(){
    var rows = await supaRequest(supaUrl('meta', '?select=key,value,updated_at'));
    var out = {};
    (rows || []).forEach(function(row){
      out[row.key] = parseJsonValue(row.value, {});
    });
    return out;
  }

  async function supabaseGetAllData(){
    if(!SUPABASE_PUBLISHABLE_KEY || SUPABASE_PUBLISHABLE_KEY.indexOf('sb_publishable_') !== 0){
      throw new Error('Supabase Publishable Key is not configured correctly in index.html.');
    }

    var results = await Promise.all([
      readUsers(),
      readTeams(),
      readJsonCollection('question_bank'),
      readJsonCollection('quizzes'),
      readJsonCollection('quiz_attempts'),
      readJsonCollection('disputes'),
      readJsonCollection('knowledge_updates'),
      readMeta()
    ]);

    var meta = results[7];
    var out = {
      users: results[0],
      teams: results[1],
      questionBank: results[2],
      quizzes: results[3],
      quizAttempts: results[4],
      disputes: results[5],
      knowledgeUpdates: results[6],
      teamUsedQuestionIds: meta.teamUsedQuestionIds || {},
      userCompletedQuizzes: meta.userCompletedQuizzes || {},
      userSeenKnowledgeUpdates: meta.userSeenKnowledgeUpdates || {},
      userKnowledgeDashboardViews: meta.userKnowledgeDashboardViews || {},
      userLogins: meta.userLogins || {}
    };
    return JSON.stringify(out);
  }

  async function upsertJsonCollection(table, items){
    items = items || [];
    var rows = items.map(function(item){
      return {id: item.id || uid(), data: JSON.stringify(item), updated_at: new Date().toISOString()};
    });

    // Replace normal portal collections so deletes are reflected.
    // quiz_attempts is intentionally handled by upsertQuizAttempts() below:
    // deleting the whole attempts table on every submission can make a
    // completed quiz disappear after refresh if an RLS/insert request fails.
    await supaRequest(supaUrl(table, '?id=not.is.null'), {method:'DELETE'});
    if(rows.length){
      await supaRequest(supaUrl(table), {method:'POST', body: JSON.stringify(rows)});
    }
  }

  async function upsertQuizAttempts(items){
    items = items || [];
    if(!items.length) return;
    var rows = items.map(function(item){
      return {id: item.id || uid(), data: JSON.stringify(item), updated_at: new Date().toISOString()};
    });
    // Never delete quiz_attempts. A completed attempt must remain durable
    // across refresh/re-login. Merge by id instead of replacing the table.
    await supaRequest(supaUrl('quiz_attempts') + '?on_conflict=id', {
      method:'POST',
      headers:{'Prefer':'resolution=merge-duplicates,return=representation'},
      body:JSON.stringify(rows)
    });
  }

  async function saveQuizAttemptDirect(attempt){
    if(!attempt || !attempt.userId || !attempt.quizId) throw new Error('Invalid quiz attempt payload.');
    var row = {id: attempt.id, data: JSON.stringify(attempt), created_at: new Date().toISOString(), updated_at: new Date().toISOString()};
    try{
      await supaRequest(supaUrl('quiz_attempts'), {
        method:'POST',
        headers:{'Prefer':'return=representation'},
        body:JSON.stringify(row)
      });
    }catch(firstError){
      // Some installations use a database-generated UUID for id. Retry once
      // without sending the client-generated short id; the attempt id is still
      // preserved inside data and is restored by readJsonCollection().
      var rowNoId = {data: JSON.stringify(attempt), created_at: row.created_at, updated_at: row.updated_at};
      try{
        var inserted = await supaRequest(supaUrl('quiz_attempts'), {
          method:'POST',
          headers:{'Prefer':'return=representation'},
          body:JSON.stringify(rowNoId)
        });
        if(inserted && inserted[0] && inserted[0].id) attempt.dbRowId = inserted[0].id;
      }catch(secondError){
        throw new Error('Quiz result could not be saved to Supabase. First: '+firstError.message+' | Retry: '+secondError.message);
      }
    }
    // The POST response is the save confirmation. Do not make the user wait
    // for a second Supabase round-trip just to verify the same insert.
    return true;
  }

  async function remoteQuizAttemptExists(userId, quizId){
    if(!userId || !quizId) return false;
    try{
      var q = '?select=id,data&data->>userId=eq.' + encodeURIComponent(userId) +
              '&data->>quizId=eq.' + encodeURIComponent(quizId) + '&limit=1';
      var rows = await supaRequest(supaUrl('quiz_attempts', q));
      return !!(rows && rows.length);
    }catch(e){
      console.warn('Remote no-retake check failed:', e);
      return false;
    }
  }

  function completionStorageKey(userId, quizId){
    return 'quiz-portal-completed-v2:' + String(userId || '') + ':' + String(quizId || '');
  }

  function localCompletionExists(userId, quizId){
    try{ return localStorage.getItem(completionStorageKey(userId, quizId)) === '1'; }catch(e){ return false; }
  }

  function markLocalCompletion(userId, quizId){
    try{ localStorage.setItem(completionStorageKey(userId, quizId), '1'); }catch(e){}
  }

  async function saveTeams(items){
    // Current Supabase schema: public.teams(id uuid, name text, created_at timestamptz)
    var current = await supaRequest(supaUrl('teams', '?select=id'));
    if(current && current.length){
      await supaRequest(supaUrl('teams', '?id=not.is.null'), {method:'DELETE'});
    }
    var rows = (items || []).map(function(name){
      return {id: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : uid(), name:name, created_at:new Date().toISOString()};
    });
    if(rows.length) await supaRequest(supaUrl('teams'), {method:'POST', body:JSON.stringify(rows)});
  }

  async function saveMetaKey(key, value){
    await supaRequest(supaUrl('meta', '?key=eq.' + encodeURIComponent(key)), {
      method:'DELETE'
    });
    await supaRequest(supaUrl('meta'), {
      method:'POST',
      body:JSON.stringify({key:key, value:JSON.stringify(value), updated_at:new Date().toISOString()})
    });
  }

  async function saveUsers(items){
    // Current Supabase schema: public.users(id text, data jsonb, created_at, updated_at).
    // Preserve the complete user object inside data so email/password/role/team
    // and mustChangePassword are never lost.
    var rows = (items || []).map(function(u){
      var id = u.id || uid();
      var copy = clone(u);
      copy.id = id;
      return {id:id, data:JSON.stringify(copy), updated_at:new Date().toISOString()};
    });
    if(rows.length){
      await supaRequest(supaUrl('users') + '?on_conflict=id', {
        method:'POST',
        headers:{'Prefer':'resolution=merge-duplicates,return=representation'},
        body:JSON.stringify(rows)
      });
    }
  }

  async function supabaseSaveChanged(payloadObj){
    var keys = Object.keys(payloadObj || {});
    for(var i=0;i<keys.length;i++){
      var key = keys[i];
      if(key === 'teams') await saveTeams(payloadObj[key]);
      else if(key === 'users') await saveUsers(payloadObj[key]);
      else if(key === 'questionBank') await upsertJsonCollection('question_bank', payloadObj[key]);
      else if(key === 'quizzes') await upsertJsonCollection('quizzes', payloadObj[key]);
      else if(key === 'quizAttempts') await upsertQuizAttempts(payloadObj[key]);
      else if(key === 'disputes') await upsertJsonCollection('disputes', payloadObj[key]);
      else if(key === 'knowledgeUpdates') await upsertJsonCollection('knowledge_updates', payloadObj[key]);
      else if(key === 'teamUsedQuestionIds' || key === 'userCompletedQuizzes' || key === 'userSeenKnowledgeUpdates' || key === 'userKnowledgeDashboardViews' || key === 'userLogins'){
        await saveMetaKey(key, payloadObj[key]);
      }
    }
    return true;
  }

  async function gsGetAllData(){
    return await supabaseGetAllData();

  async function gsSaveChanged(payloadObj){
    return await supabaseSaveChanged(payloadObj);

  function normalizeData(d){
    if(!d.teams) d.teams = DEFAULT_TEAMS.slice();
    if(!d.teamUsedQuestionIds) d.teamUsedQuestionIds = {};
    if(!d.quizzes) d.quizzes = [];
    if(!d.quizAttempts) d.quizAttempts = [];
    if(!d.disputes) d.disputes = [];
    if(!d.userCompletedQuizzes) d.userCompletedQuizzes = {};
    if(!d.userLogins) d.userLogins = {};
    if(!d.knowledgeUpdates) d.knowledgeUpdates = [];
    if(!d.userSeenKnowledgeUpdates) d.userSeenKnowledgeUpdates = {};
    if(!d.userKnowledgeDashboardViews) d.userKnowledgeDashboardViews = {};
    if(!d.users) d.users = [];
    if(!d.questionBank) d.questionBank = [];
    d.questionBank.forEach(function(q){
      if(!q.acceptedIndexes) q.acceptedIndexes = [Number(q.correctIndex)];
      // correctIndex/correctOption remain the ORIGINAL answer. acceptedIndexes is
      // used only for scoring after a dispute; never overwrite the displayed original answer.
      if(!q.createdBy) q.createdBy = {id:null, name:'Legacy / Unknown', email:''};
      if(q.createdAt === undefined) q.createdAt = null;
      if(q.updatedBy === undefined) q.updatedBy = null;
      if(q.updatedAt === undefined) q.updatedAt = null;
    });

    // NO-RETAKE SOURCE OF TRUTH: public.quiz_attempts only.
    // userCompletedQuizzes is a legacy/cache meta key. It must NEVER be merged
    // into the completion map because an Admin can delete an attempt directly
    // from Supabase. Once that row is deleted, the quiz must become available
    // again for that user after the next data refresh/login.
    var completedMap = {};
    (d.quizAttempts || []).forEach(function(attempt){
      if(!attempt || !attempt.userId || !attempt.quizId) return;
      if(!completedMap[attempt.userId]) completedMap[attempt.userId] = [];
      if(completedMap[attempt.userId].indexOf(attempt.quizId) === -1){
        completedMap[attempt.userId].push(attempt.quizId);
      }
    });
    d.userCompletedQuizzes = completedMap;

    d.users.forEach(function(u){
      if(u.team === undefined) u.team = null;
      if(u.photo === undefined) u.photo = null;
      if(ROLES.indexOf(u.role) === -1) u.role = 'User';
    });
    return d;
  }

  async function loadData(){
    try{
      var raw = await gsGetAllData();
      var fresh = null;
      try{ fresh = raw ? JSON.parse(raw) : null; }catch(e){ fresh = null; }

      var isEmpty = !fresh || !fresh.users || fresh.users.length === 0;
    if(isEmpty){
      // First-ever run against this database: seed every tab at once.
      state.data = normalizeData(defaultData());
      var seedPayload = {};
      SYNC_KEYS.forEach(function(k){ seedPayload[k] = state.data[k]; });
      await gsSaveChanged(seedPayload);
    }else{
      state.data = normalizeData(fresh);
    }
    // Clear legacy browser completion flags for quizzes that no longer have a
    // corresponding attempt. These flags are not used to decide availability,
    // but removing them prevents older versions of the portal from re-blocking
    // a quiz on the same browser.
    try{
      var stalePrefix='quiz-portal-completed-v2:';
      Object.keys(localStorage).forEach(function(k){
        if(k.indexOf(stalePrefix)!==0) return;
        var parts=k.slice(stalePrefix.length).split(':');
        if(parts.length<2) return;
        var uid0=parts[0], qid0=parts.slice(1).join(':');
        var stillExists=(state.data.quizAttempts||[]).some(function(a){return a && a.userId===uid0 && a.quizId===qid0;});
        if(!stillExists) localStorage.removeItem(k);
      });
    }catch(cleanErr){ console.warn('Legacy completion cleanup skipped:',cleanErr); }
    state.lastSyncedData = JSON.parse(JSON.stringify(state.data));

    var session = sessionGet(SESSION_KEY);
    if(session){
      var u = state.data.users.find(function(x){return x.id===session;});
      if(u) state.currentUserId = u.id;
    }
      render();
    }catch(e){
      console.error('Quiz Portal startup error:', e);
      var root = document.getElementById('app');
      if(root){
        root.innerHTML = '<div style="max-width:760px;margin:60px auto;padding:24px;background:#fff;border:1px solid #e3e6eb;border-radius:14px;font-family:Arial,sans-serif;">' +
          '<h2 style="margin:0 0 12px;color:#c0392b;">Supabase connection error</h2>' +
          '<p style="margin:0 0 12px;">The portal could not load its data. The exact error is:</p>' +
          '<pre style="white-space:pre-wrap;background:#f5f6f8;padding:14px;border-radius:10px;overflow:auto;">' +
          String(e && e.message ? e.message : e) +
          '</pre>' +
          '<p style="margin:12px 0 0;color:#666;">Please send this exact error to the assistant before changing any database settings.</p>' +
          '</div>';
      }
    }
  }

  var saveInFlight = false;
  var savePendingAgain = false;
  async function saveData(){
    if(saveInFlight){ savePendingAgain = true; return; }
    saveInFlight = true;
    try{
      var changedKeys = SYNC_KEYS.filter(function(k){
        return JSON.stringify(state.data[k]) !== JSON.stringify(state.lastSyncedData ? state.lastSyncedData[k] : undefined);
      });
      if(changedKeys.length){
        var payload = {};
        changedKeys.forEach(function(k){ payload[k] = state.data[k]; });
        await gsSaveChanged(payload);
      }
      // Do NOT reload the entire database after every small UI action.
      // That round-trip was making normal user clicks feel slow. The server
      // write above is already awaited; keep the local state and mark the
      // changed collections as synced. Fresh server data is loaded on login
      // / explicit reload instead.
      state.data = normalizeData(state.data);
      if(!state.lastSyncedData) state.lastSyncedData = {};
      changedKeys.forEach(function(k){
        state.lastSyncedData[k] = JSON.parse(JSON.stringify(state.data[k]));
      });
    }catch(e){
      console.error('saveData error:', e);
    }
    saveInFlight = false;
    if(savePendingAgain){ savePendingAgain = false; setTimeout(saveData, 0); }
  }

  function isAnswerAccepted(question, index){
    return (question.acceptedIndexes || []).some(function(i){ return Number(i) === Number(index); });

  // V11.1 FIX: keep the final-answer helper in global scope.
  // The previous version accidentally declared it inside the dispute resolver,
  // so leaderboard/history loading could throw: isFinalAnswerAccepted is not defined.
  function getFinalAcceptedIndexes(question){
    if(!question) return [];
    if(Array.isArray(question.acceptedIndexes) && question.acceptedIndexes.length) return question.acceptedIndexes.map(Number);
    return [Number(question.correctIndex)];
  }
  function isFinalAnswerAccepted(question, selectedIndex){
    return getFinalAcceptedIndexes(question).some(function(i){ return Number(i) === Number(selectedIndex); });
  }
  function recomputeScoresForQuestion(questionId, remarkText){
    var targetQ = state.data.questionBank.find(function(x){return x.id===questionId;});
    if(!targetQ) return [];
    var changedAttempts = [];

    // Recalculate every attempt using the correct Question Bank record for
    // each answer. The previous implementation compared every answer against
    // the disputed question, which could produce wrong totals.
    state.data.quizAttempts.forEach(function(attempt){
      var answers = attempt.answers || [];
      var calculated = 0;
      var changed = false;

      answers.forEach(function(ans){
        var q = state.data.questionBank.find(function(x){return x.id===ans.questionId;});
        var accepted = !!(q && isFinalAnswerAccepted(q, ans.selectedIndex));
        var nextCorrect = accepted;
        if(ans.isCorrect !== nextCorrect){ ans.isCorrect = nextCorrect; changed = true; }
        if(q && ans.questionId === questionId && nextCorrect){
          ans.remark = remarkText || 'Marked correct after dispute review';
          changed = true;
        }
        if(nextCorrect) calculated += 1;
      });

      if(Number(attempt.score || 0) !== calculated){
        attempt.score = calculated;
        changed = true;
      }
      if(answers.some(function(a){return a.questionId===questionId;})) changedAttempts.push(attempt);
    });
    return changedAttempts;
  }
  function quizStartMs(quiz){
    if(quiz.startDateTime) return new Date(quiz.startDateTime).getTime();
    return new Date(quiz.scheduledDate + 'T' + (quiz.scheduledTime||'00:00') + ':00').getTime();
  }
  function quizEndMs(quiz){
    if(quiz.endDateTime) return new Date(quiz.endDateTime).getTime();
    // Backward compatibility for older quizzes created before Start/End window.
    return quizStartMs(quiz) + ((parseInt(quiz.durationMinutes,10)||30) * 60000);
  }
  function quizResultsPublished(quiz){ return Date.now() >= quizEndMs(quiz); }
  function quizStatus(quiz){
    if(!quiz.enabled) return 'off';
    var now=Date.now(), start=quizStartMs(quiz), end=quizEndMs(quiz);
    if(now < start) return 'scheduled';
    if(now >= end) return 'ended';
    return 'running';
  }

  function isKnowledgeUpdateLive(ku){
    if(ku.status !== 1) return false;
    return new Date(ku.startDateTime).getTime() <= Date.now();
  }
  function liveKnowledgeUpdates(){
    return state.data.knowledgeUpdates.filter(isKnowledgeUpdateLive).sort(function(a,b){ return new Date(b.startDateTime) - new Date(a.startDateTime); });
  }
  function anyUnseenKnowledgeUpdateLive(){
    var seen = state.data.userSeenKnowledgeUpdates[state.currentUserId] || [];
    return liveKnowledgeUpdates().some(function(ku){ return seen.indexOf(ku.id) === -1; });
  }
  function markLiveKnowledgeUpdatesSeen(){
    if(!state.data.userSeenKnowledgeUpdates[state.currentUserId]) state.data.userSeenKnowledgeUpdates[state.currentUserId] = [];
    var seen = state.data.userSeenKnowledgeUpdates[state.currentUserId];
    liveKnowledgeUpdates().forEach(function(ku){ if(seen.indexOf(ku.id) === -1) seen.push(ku.id); });
    saveData();
  }
  /* ================= LEADERBOARD SCORE ENGINE (V11) ================= */
  // The leaderboard must never trust a stale attempt.score after a dispute.
  // A resolved dispute changes Question Bank.acceptedIndexes, so the effective
  // score is derived again from the attempt answers + the current accepted
  // answer state. The persisted score is still used everywhere else as the
  // normal source of truth, but the leaderboard is dispute-safe by design.
  function effectiveAttemptScore(attempt){
    var answers = Array.isArray(attempt && attempt.answers) ? attempt.answers : [];
    var correct = 0;
    answers.forEach(function(ans){
      var q = state.data.questionBank.find(function(x){return x.id===ans.questionId;});
      if(q){
        if(isFinalAnswerAccepted(q, ans.selectedIndex)) correct++;
        return;
      }
      // If the question was removed from the bank, retain the stored marking
      // from the attempt instead of silently changing historical results.
      if(ans.isCorrect) correct++;
    });
    var total = Number(attempt && attempt.total);
    if(!total || total < answers.length) total = answers.length;
    return {score:correct,total:total,pct:total ? (correct/total)*100 : 0};
  }

  function leaderboardData(teamFilter){
    var bestByUser = {};
    state.data.quizAttempts.forEach(function(a){
      var q = state.data.quizzes.find(function(x){return x.id===a.quizId;});
      if(q && !quizResultsPublished(q)) return;
      if(teamFilter && String(a.team||'').trim().toLowerCase() !== String(teamFilter||'').trim().toLowerCase()) return;

      // V11 FIX: calculate the leaderboard result from the CURRENT accepted
      // answers. This immediately reflects an Admin-approved dispute even if
      // an old/stale score is still present in the attempt record.
      var effective = effectiveAttemptScore(a);
      var pct = effective.pct;
      var existing = bestByUser[a.userId];
      if(!existing || pct > existing.pct || (pct === existing.pct && effective.score > existing.score) ||
         (pct === existing.pct && effective.score === existing.score && (a.finishedAt||Infinity) < (existing.finishedAt||Infinity))){
        bestByUser[a.userId] = {attempt:a,pct:pct,effective:effective};
      }
    });
    var rows = Object.keys(bestByUser).map(function(userId){
      var u = state.data.users.find(function(x){return x.id===userId;});
      if(!u) return null;
      var item=bestByUser[userId], a=item.attempt, effective=item.effective;
      return {user:u, score:effective.score, total:effective.total, pct:Math.round(item.pct), attempts:1, finishedAt:a.finishedAt, quizTitle:a.quizTitle};
    }).filter(Boolean);
    rows.sort(function(a,b){ if(b.pct!==a.pct) return b.pct-a.pct; if(b.score!==a.score) return b.score-a.score; return (a.finishedAt||Infinity)-(b.finishedAt||Infinity); });
    return rows;
  }

  function renderAllTeamsTopPerformersCard(){
    var card=document.createElement('div'); card.className='card';
    card.innerHTML='<div class="section-title">Top Performers — All Teams</div><div style="font-size:11px;color:var(--text-mute);margin:-6px 0 14px;">Highest score wins. If scores are tied, the fastest quiz submission wins.</div>';
    var table=document.createElement('table'); table.className='data-table';
    table.innerHTML='<tr><th>Team</th><th>Top Performer</th><th>Score</th><th>Quiz</th><th>Submitted</th></tr>';
    var has=false;
    state.data.teams.forEach(function(team){
      var rows=leaderboardData(team); var r=rows[0];
      var tr=document.createElement('tr');
      if(r){has=true; tr.innerHTML='<td>'+escapeHtml(team)+'</td><td style="font-weight:600;">'+escapeHtml(r.user.name)+'</td><td>'+r.score+' / '+r.total+' ('+r.pct+'%)</td><td>'+escapeHtml(r.quizTitle||'—')+'</td><td>'+fmtDateTime(r.finishedAt)+'</td>';}
      else tr.innerHTML='<td>'+escapeHtml(team)+'</td><td colspan="4" style="color:var(--text-mute);">No published quiz result yet</td>';
      table.appendChild(tr);
    });
    if(!state.data.teams.length) card.innerHTML+='<div class="empty-note">No teams found.</div>'; else card.appendChild(table);
    return card;
  }

  /* ================= RENDER ROOT ================= */
  function render(){
    var root = document.getElementById('app');
    root.innerHTML = '';

    if(!state.currentUserId){
      root.appendChild(renderLogin());
      return;
    }
    var user = currentUser();
    if(!user){ state.currentUserId = null; sessionSet(SESSION_KEY,''); render(); return; }

    var layout = document.createElement('div');
    layout.className = 'app-layout';
    var sidebar = renderSidebar(user);
    layout.appendChild(sidebar);
    var overlay = document.createElement('div');
    overlay.className = 'mobile-sidebar-overlay';
    overlay.id = 'mobileSidebarOverlay';
    overlay.onclick = function(){ sidebar.classList.remove('mobile-open'); overlay.classList.remove('open'); };
    layout.appendChild(overlay);

    var workspace = document.createElement('div');
    workspace.className = 'workspace' + (state.sidebarCollapsed ? ' collapsed' : '');
    workspace.appendChild(renderTopbar());
    var shell = document.createElement('div');
    shell.className = 'shell';
    workspace.appendChild(shell);

    if(user.role === 'Admin'){
      if(state.tab === 'users') shell.appendChild(renderUserManagement());
      else if(state.tab === 'teams') shell.appendChild(renderTeamManagement());
      else if(state.tab === 'quizmgmt') shell.appendChild(renderQuizManagement());
      else if(state.tab === 'disputes') shell.appendChild(renderDisputeManagement());
      else if(state.tab === 'knowledge') shell.appendChild(renderKnowledgeUpdatesAdmin());
      else if(state.tab === 'reports') shell.appendChild(renderReports(null));
      else if(state.tab === 'backup') shell.appendChild(renderBackupRestore());
      else if(state.tab === 'audit') shell.appendChild(renderAuditLogAdmin());
      else shell.appendChild(renderUserManagement());
    }else if(user.role === 'Management'){
      shell.appendChild(renderReports(null));
    }else if(user.role === 'Team Leader'){
      shell.appendChild(renderLeaderTabs());
      if(state.tab === 'teamdash') shell.appendChild(renderReports(user.team));
      else if(state.tab === 'password') shell.appendChild(renderChangePassword());
      else shell.appendChild(renderReports(user.team));
    }else{
      if(state.tab === 'quiz') shell.appendChild(renderUserQuizHome());
      else if(state.tab === 'history') shell.appendChild(renderUserHistory());
      else if(state.tab === 'profile') shell.appendChild(renderUserProfile());
      else if(state.tab === 'password') shell.appendChild(renderChangePassword());
      else shell.appendChild(renderUserQuizHome());
    }

    layout.appendChild(workspace);
    root.appendChild(layout);
    if(state.quizSession) root.appendChild(renderQuizModal());
    if(state.viewingAttemptId) root.appendChild(renderAttemptDetailModal());
    if(state.viewingKuId) root.appendChild(renderKnowledgeUpdateViewModal());
    if(state.viewingQuestionAuditId) root.appendChild(renderQuestionAuditModal(state.viewingQuestionAuditId));
  }

    var emailRow = document.createElement('div');
    emailRow.className = 'form-row';
    emailRow.innerHTML = '<label>Email</label>';
    var emailInput = document.createElement('input');
    emailInput.type = 'email'; emailInput.name = 'email'; emailInput.autocomplete = 'username';
    emailInput.placeholder = 'you@guardianlife.com'; emailInput.required = true;
    emailRow.appendChild(emailInput);
    form.appendChild(emailRow);

    var pwRow = document.createElement('div');
    pwRow.className = 'form-row';
    pwRow.innerHTML = '<label>Password</label>';
    var pwInput = document.createElement('input');
    pwInput.type = 'password'; pwInput.name = 'password'; pwInput.autocomplete = 'current-password';
    pwInput.placeholder = '\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022'; pwInput.required = true;
    pwRow.appendChild(pwInput);
    form.appendChild(pwRow);

    var loginBtn = document.createElement('button');
    loginBtn.type = 'submit';
    loginBtn.className = 'btn primary btn-full';
    loginBtn.textContent = 'Log in';
    form.appendChild(loginBtn);

    form.addEventListener('submit', function(e){
      e.preventDefault();
      var email = emailInput.value.trim().toLowerCase();
      var pw = pwInput.value;
      var u = state.data.users.find(function(x){ return x.email.toLowerCase() === email; });
      if(!u || u.password !== pw){
        state.loginError = 'Incorrect email or password.';
        render();
        return;
      }
      state.currentUserId = u.id;
      state.loginError = '';
      state.data.userLogins[u.id] = Date.now();
      saveData();
      sessionSet(SESSION_KEY, u.id);
      state.tab = u.role === 'Admin' ? 'users' : (u.role === 'Team Leader' ? 'teamdash' : 'quiz');
      render();
      // Letting the form's own submit event fire (rather than only handling
      // a button click) is what allows Chrome/Firefox/Edge to detect this as
      // a real login and offer to save the credentials in the browser.
    });

    card.appendChild(form);

    var note = document.createElement('div');
    note.className = 'login-note';
    note.textContent = 'Your browser may offer to save this password for faster sign-in next time. That\u2019s handled entirely by your browser \u2014 the admin never sees it. Forgot your password? Ask your admin to reset it.';
    card.appendChild(note);

    wrap.appendChild(card);
    setTimeout(function(){ emailInput.focus(); }, 0);
    return wrap;
  }

      var email = emailInput.value.trim().toLowerCase();
      if(!name || !email){ alert('Name and email are required.'); return; }
      if(roleSelect.value === 'Team Leader' && !teamSelect.value){ alert('A Team Leader must be assigned a team.'); return; }
      var clash = state.data.users.find(function(u){ return u.email.toLowerCase()===email && (!editing || u.id!==editing.id); });
      if(clash){ alert('This email is already assigned to another account.'); return; }
      if(editing){
        editing.name = name; editing.email = email; editing.role = roleSelect.value;
        editing.team = teamSelect.value || null; editing.photo = photoState.dataUrl;

        if(!pwInput.value.trim()){ alert('Please set a default password.'); return; }

        '<td>'+(u.team ? escapeHtml(u.team) : '<span style="color:var(--text-mute);">\u2014</span>')+'</td>'+
        '<td>'+(u.mustChangePassword ? '<span style="font-size:11px;color:var(--text-mute);">Password not yet changed</span>' : '<span style="font-size:11px;color:var(--green);">Active</span>')+'</td>';
      var tdActions = document.createElement('td');
      tdActions.style.cssText = 'display:flex;gap:6px;';

      editBtn.className = 'btn secondary small'; editBtn.textContent = 'Edit';

      tdActions.appendChild(editBtn);
      if(u.id !== state.currentUserId){
        var delBtn = document.createElement('button');
        delBtn.className = 'btn danger small'; delBtn.textContent = 'Delete';
        delBtn.onclick = function(){
          if(!confirm('Remove ' + u.name + '\u2019s account? This cannot be undone.')) return;

          saveData(); render();

        tdActions.appendChild(delBtn);
      }
      tr.appendChild(tdActions);
      table.appendChild(tr);
    });
    listCard.appendChild(table);
    wrap.appendChild(listCard);
    return wrap;

  /* Prevent duplicate pending disputes for the same attempt/question.
     Existing duplicate rows are marked as duplicate instead of being shown
     repeatedly in the Admin queue. */
  async function cleanupDuplicatePendingDisputes(){
    var groups = {};
    (state.data.disputes || []).forEach(function(d){
      if(d.status !== 'pending') return;
      var key = String(d.attemptId||'') + '::' + String(d.questionId||'');
      (groups[key]||(groups[key]=[])).push(d);
    });
    var writes=[];
    Object.keys(groups).forEach(function(key){
      var arr=groups[key];
      if(arr.length<2) return;
      arr.sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
      // Keep the newest pending dispute; older identical submissions are no
      // longer actionable and should not keep reappearing in Admin.
      arr.slice(1).forEach(function(d){
        d.status='duplicate';
        d.resolution='duplicate_submission';
        d.adminNote='Duplicate submission automatically closed.';
        d.resolvedAt=Date.now();
        writes.push(supaRequest(supaUrl('disputes')+'?id=eq.'+encodeURIComponent(d.id),{
          method:'PATCH',headers:{'Prefer':'return=representation'},
          body:JSON.stringify({data:JSON.stringify(d),updated_at:new Date().toISOString()})
        }));
      });
    });
    if(writes.length) await Promise.all(writes);
  }

  function renderKnowledgeUpdatesCard(){
    var card = document.createElement('div');
    card.className = 'card';

    var userId = state.currentUserId;
    var live = liveKnowledgeUpdates();
    var seen = state.data.userSeenKnowledgeUpdates[userId] || [];
    var views = state.data.userKnowledgeDashboardViews[userId] || {};

    // Daily Updates are no longer a login gate. New updates can be opened
    // from the dashboard. After an update has been read, it is not forced open
    // on login; it remains accessible from its title/View button and is shown
    // for at most two dashboard views.
    var dashboardItems = live.filter(function(k){
      return seen.indexOf(k.id) === -1 || Number(views[k.id] || 0) < 2;
    });

    if(!dashboardItems.length){
      card.innerHTML += '<div class="empty-note">No updates to show.</div>';
      return card;
    }

    if(!state.data.userKnowledgeDashboardViews[userId]) state.data.userKnowledgeDashboardViews[userId] = {};
    dashboardItems.forEach(function(k){
      var row = document.createElement('div');
      row.className = 'quiz-list-row';
      row.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:12px;';
      var unread = seen.indexOf(k.id) === -1;
      row.innerHTML = '<div style="flex:1;min-width:0;cursor:pointer"><div class="quiz-list-title">'+escapeHtml(k.name)+'</div><div class="quiz-list-meta">'+fmtDateTime(k.startDateTime)+(unread?' · <b style="color:var(--orange)">New</b>':'')+'</div></div>';
      var viewBtn=document.createElement('button'); viewBtn.className='btn secondary small'; viewBtn.textContent='View';
      function openUpdate(){
        if(row.dataset.opening==='1') return; row.dataset.opening='1';
        if(seen.indexOf(k.id)===-1){
          if(!state.data.userSeenKnowledgeUpdates[userId]) state.data.userSeenKnowledgeUpdates[userId]=[];
          state.data.userSeenKnowledgeUpdates[userId].push(k.id);
          if(!state.data.userKnowledgeDashboardViews[userId]) state.data.userKnowledgeDashboardViews[userId]={};
          state.data.userKnowledgeDashboardViews[userId][k.id]=0;
          setTimeout(saveData,0);
        }
        state.viewingKuId=k.id; render();
      }
      row.firstElementChild.onclick=openUpdate; viewBtn.onclick=openUpdate; row.appendChild(viewBtn); card.appendChild(row);
    });

    // Count a dashboard view once when the dashboard is actually entered,
    // not every time render() redraws the same dashboard in the same visit.
    var visitKey = 'quiz-portal-dashboard-visit:' + String(userId) + ':' + String(Date.now());
    if(!state._knowledgeDashboardVisitId) state._knowledgeDashboardVisitId = uid();
    var countedKey = 'quiz-portal-ku-counted:' + state._knowledgeDashboardVisitId;
    var alreadyCounted = {};
    try{ alreadyCounted = JSON.parse(sessionStorage.getItem(countedKey) || '{}'); }catch(e){}
    dashboardItems.forEach(function(k){
      if(!alreadyCounted[k.id]){
        state.data.userKnowledgeDashboardViews[userId][k.id] = Number(state.data.userKnowledgeDashboardViews[userId][k.id] || 0) + 1;
        alreadyCounted[k.id] = true;
      }
    });
    try{ sessionStorage.setItem(countedKey, JSON.stringify(alreadyCounted)); }catch(e){}
    // Persist in the background; do not make dashboard rendering wait on Supabase.
    if(dashboardItems.length) setTimeout(function(){ saveData(); }, 0);
    return card;
  }

  function renderDisputeManagement(){
    var wrap = document.createElement('div');
