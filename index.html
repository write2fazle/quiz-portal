<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Portal</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root{
  --navy:#1B2A4A;
  --navy-dim:#2B3E63;
  --orange:#F46B12;
  --orange-dim:#F79A5C;
  --orange-dark:#C6540C;
  --bg:#F5F6F8;
  --surface:#FFFFFF;
  --surface-2:#F0F2F5;
  --line:#E3E6EB;
  --text:#1F2430;
  --text-dim:#6B7280;
  --text-mute:#9CA3AF;
  --green:#2F9E58;
  --green-bg:#E7F6EC;
  --red:#D64545;
  --red-bg:#FBE9E9;
  --blue:#2F6FE0;
  --blue-bg:#E9F0FE;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;width:100%;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
button,select,input,textarea{font-family:'Inter',sans-serif;}
button{cursor:pointer;}

.shell{width:100%;max-width:1160px;margin:0 auto;padding:20px 20px 60px;}

/* ---- top bar ---- */
.topbar{display:flex;align-items:center;gap:16px;background:var(--navy);color:#fff;border-radius:12px;padding:14px 20px;margin-bottom:20px;}
.brand{font-weight:700;font-size:17px;display:flex;align-items:center;gap:10px;}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--orange);}
.top-user{display:flex;align-items:center;gap:12px;margin-left:auto;font-size:13px;}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--orange);color:#fff;font-weight:600;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.role-pill{font-size:10px;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,0.15);margin-left:6px;}
.logout-btn{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);color:#fff;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;}
.logout-btn:hover{background:rgba(255,255,255,0.25);}

/* ---- login ---- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:36px 34px;width:100%;max-width:380px;box-shadow:0 12px 40px rgba(20,25,40,0.08);}
.login-logo{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:6px;}
.login-logo img{width:84px;height:84px;border-radius:16px;object-fit:cover;}
.login-logo span{font-weight:700;font-size:19px;color:var(--navy);}
.login-sub{font-size:13px;color:var(--text-dim);margin-bottom:24px;text-align:center;}
.login-error{background:var(--red-bg);color:var(--red);font-size:12px;padding:9px 12px;border-radius:8px;margin-bottom:14px;}
.login-note{font-size:11px;color:var(--text-mute);margin-top:18px;line-height:1.6;text-align:center;}
.remember-row{display:flex;align-items:center;gap:8px;margin:-4px 0 16px;}
.remember-row label{font-size:12px;color:var(--text-dim);}

/* ---- tabs ---- */
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
.tab-btn{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:9px 18px;font-size:13px;color:var(--text-dim);font-weight:500;}
.tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.tab-btn:hover:not(.active){border-color:var(--orange-dim);color:var(--text);}
.subtabs{display:flex;gap:6px;margin-bottom:16px;}
.subtab-btn{background:none;border:none;padding:8px 4px;font-size:13px;color:var(--text-dim);border-bottom:2px solid transparent;font-weight:500;}
.subtab-btn.active{color:var(--orange);border-bottom-color:var(--orange);}

/* ---- cards ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:16px;}
.section-title{font-size:13px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.3px;margin-bottom:14px;}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center;}
.stat-icon{font-size:20px;margin-bottom:4px;}
.stat-num{font-size:24px;font-weight:700;color:var(--navy);font-family:'JetBrains Mono',monospace;}
.stat-lbl{font-size:11px;color:var(--text-dim);margin-top:2px;}
.empty-note{text-align:center;color:var(--text-mute);font-size:13px;padding:26px 10px;}

/* ---- forms ---- */
.form-row{margin-bottom:14px;}
.form-row label{display:block;font-size:11px;color:var(--text-dim);margin-bottom:6px;letter-spacing:0.2px;}
.form-row input[type=text],.form-row input[type=email],.form-row input[type=password],.form-row input[type=number],.form-row select,.form-row input[type=date],.form-row input[type=time],.form-row textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--text);
}
.form-row input:focus,.form-row select:focus{outline:none;border-color:var(--orange-dim);}
.btn{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:13px;font-weight:600;}
.btn:hover{background:var(--navy-dim);}
.btn.primary{background:var(--orange);}
.btn.primary:hover{background:var(--orange-dark);}
.btn.secondary{background:none;border:1px solid var(--line);color:var(--text);}
.btn.secondary:hover{border-color:var(--orange-dim);color:var(--orange);}
.btn.danger{background:none;border:1px solid var(--red);color:var(--red);}
.btn.danger:hover{background:var(--red-bg);}
.btn.small{padding:6px 12px;font-size:11px;}
.btn:disabled{opacity:0.5;cursor:not-allowed;}
.btn-full{width:100%;padding:11px;font-size:14px;}

table.data-table{width:100%;border-collapse:collapse;font-size:13px;}
table.data-table th{text-align:left;font-size:11px;color:var(--text-mute);text-transform:uppercase;letter-spacing:0.3px;padding:9px 10px;border-bottom:1px solid var(--line);}
table.data-table td{padding:10px 10px;border-bottom:1px solid var(--line);}
table.data-table tr:last-child td{border-bottom:none;}
.role-badge{font-size:10px;padding:3px 9px;border-radius:10px;font-weight:600;}
.role-badge.admin{background:var(--red-bg);color:var(--red);}
.role-badge.user{background:var(--green-bg);color:var(--green);}
.role-badge.leader{background:var(--blue-bg);color:var(--blue);}
.role-badge.management{background:#F1E9FC;color:#7B3FE4;}
.status-badge{font-size:10px;padding:3px 9px;border-radius:10px;font-weight:600;}
.status-badge.running{background:var(--green-bg);color:var(--green);}
.status-badge.scheduled{background:#FFF1E4;color:var(--orange);}
.status-badge.off{background:var(--surface-2);color:var(--text-mute);}

/* ---- quiz list / taking ---- */
.quiz-list-row{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;}
.quiz-list-title{font-size:14px;font-weight:600;}
.quiz-list-meta{font-size:11px;color:var(--text-dim);margin-top:3px;}
.quiz-progress{font-size:11px;color:var(--text-mute);margin-bottom:6px;}
.quiz-dots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.quiz-dot{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);}
.quiz-dot.current{border-color:var(--orange);color:var(--orange);font-weight:700;}
.quiz-dot.answered{background:var(--navy);color:#fff;border-color:var(--navy);}
.quiz-dot.answered.current{background:var(--orange);border-color:var(--orange);}
.quiz-question{font-size:16px;font-weight:600;margin-bottom:16px;line-height:1.5;}
.quiz-option{display:block;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:13px;margin-bottom:9px;color:var(--text);}
.quiz-option:hover{border-color:var(--orange-dim);}
.quiz-option.selected{border-color:var(--orange);background:#FFF1E4;color:var(--orange-dark);font-weight:600;}
.quiz-nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:8px;}
.quiz-result{text-align:center;padding:24px 10px;}
.quiz-result .score{font-size:40px;font-weight:700;color:var(--orange);font-family:'JetBrains Mono',monospace;}
.quiz-timer{background:var(--orange);color:#fff;font-size:12px;padding:4px 10px;border-radius:10px;font-family:'JetBrains Mono',monospace;}
.quiz-timer.low{background:var(--red);}

/* ---- podium ---- */
.podium{display:flex;justify-content:center;align-items:flex-end;gap:20px;margin-bottom:22px;flex-wrap:wrap;}
.podium-slot{display:flex;flex-direction:column;align-items:center;text-align:center;width:120px;}
.podium-photo-wrap{position:relative;margin-bottom:10px;}
.podium-photo{border-radius:50%;object-fit:cover;border:3px solid var(--orange);background:var(--surface-2);}
.podium-photo-placeholder{border-radius:50%;background:var(--surface-2);border:3px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--text-mute);font-weight:700;}
.podium-rank-badge{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);background:var(--orange);color:#fff;font-size:11px;font-weight:700;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #fff;}
.podium-slot.rank1 .podium-photo,.podium-slot.rank1 .podium-photo-placeholder{width:100px;height:100px;font-size:32px;border-color:#F4B740;}
.podium-slot.rank1 .podium-rank-badge{background:#F4B740;}
.podium-slot.rank2 .podium-photo,.podium-slot.rank2 .podium-photo-placeholder{width:80px;height:80px;font-size:26px;border-color:#B7BEC7;}
.podium-slot.rank2 .podium-rank-badge{background:#9AA3AF;}
.podium-slot.rank3 .podium-photo,.podium-slot.rank3 .podium-photo-placeholder{width:80px;height:80px;font-size:26px;border-color:#D79A6B;}
.podium-slot.rank3 .podium-rank-badge{background:#C9803F;}
.podium-name{font-size:13px;font-weight:700;margin-top:2px;}
.podium-team{font-size:11px;color:var(--text-dim);}
.podium-score{font-size:12px;color:var(--orange);font-weight:700;margin-top:2px;font-family:'JetBrains Mono',monospace;}

/* ---- charts ---- */
.chart-row{display:flex;gap:16px;flex-wrap:wrap;}
.chart-box{flex:1;min-width:220px;}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12px;}
.bar-label{width:130px;flex:none;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-track{flex:1;background:var(--surface-2);border-radius:6px;height:14px;overflow:hidden;}
.bar-fill{height:100%;background:var(--orange);border-radius:6px;}
.bar-value{width:44px;flex:none;text-align:right;font-family:'JetBrains Mono',monospace;color:var(--text-dim);}
.legend-row{display:flex;align-items:center;gap:6px;font-size:12px;margin-top:6px;}
.legend-dot{width:10px;height:10px;border-radius:50%;flex:none;}

/* ---- review blocks ---- */
.review-block{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;}
.review-q{font-size:13px;font-weight:600;margin-bottom:6px;}
.review-a{font-size:12px;color:var(--text-dim);}
.review-remark{font-size:11px;color:var(--green);margin-top:6px;}

/* ---- history filters ---- */
.filter-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:flex-end;}

.ku-toolbar-row{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.ku-search-box{flex:1;min-width:220px;}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}
.status-dot.on{background:var(--green);}
.status-dot.off{background:var(--text-mute);}
.icon-btn{width:30px;height:30px;border-radius:6px;border:none;color:#fff;font-size:13px;display:inline-flex;align-items:center;justify-content:center;margin-right:4px;}
.icon-btn.view{background:#1AA6B7;}
.icon-btn.edit{background:var(--orange);}
.icon-btn.delete{background:var(--red);}
.rte-mini-toolbar{display:flex;gap:4px;flex-wrap:wrap;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;background:var(--surface-2);padding:6px;}
.rte-mini-btn{background:none;border:1px solid transparent;border-radius:5px;padding:5px 9px;font-size:12px;color:var(--text);min-width:28px;}
.rte-mini-btn:hover{background:var(--surface);border-color:var(--line);}
.rte-mini-editor{border:1px solid var(--line);border-radius:0 0 8px 8px;min-height:160px;padding:12px 14px;font-size:13px;line-height:1.6;background:var(--surface);}
.rte-mini-editor:focus{outline:none;border-color:var(--orange-dim);}
.rte-mini-editor:empty:before{content:attr(data-placeholder);color:var(--text-mute);}
.ku-content-view{font-size:13px;line-height:1.7;}
.ku-content-view img{max-width:100%;}

.admin-menu-wrap{position:relative;}
.admin-menu-btn{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);color:#fff;border-radius:6px;width:30px;height:30px;font-size:16px;display:flex;align-items:center;justify-content:center;}
.admin-menu-btn:hover{background:rgba(255,255,255,0.22);}
.admin-menu-panel{position:absolute;top:calc(100% + 8px);left:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,0.16);padding:6px;min-width:200px;z-index:90;display:none;}
.admin-menu-panel.open{display:block;}
.admin-menu-item{display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:13px;color:var(--text);border-radius:6px;cursor:pointer;white-space:nowrap;}
.admin-menu-item:hover{background:var(--surface-2);}
.admin-menu-item.active{background:var(--surface-2);color:var(--orange);font-weight:600;}
.admin-menu-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;}
.filter-row .form-row{margin-bottom:0;flex:1;min-width:160px;}

/* ---- modal ---- */
.modal-overlay{position:fixed;inset:0;background:rgba(20,25,40,0.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;}
.modal-box{background:var(--surface);border-radius:12px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;padding:22px 24px;}
.modal-box.wide{max-width:820px;}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.modal-close{background:none;border:none;font-size:18px;color:var(--text-mute);}
.modal-close:hover{color:var(--text);}
.modal-title{font-size:17px;font-weight:700;margin:0;}

@media(max-width:640px){
  .stat-grid{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){

  /* ================= HELPERS ================= */
  function escapeHtml(s){
    var div = document.createElement('div');
    div.textContent = s == null ? '' : String(s);
    return div.innerHTML;
  }
  function uid(){ return Math.random().toString(36).slice(2,10); }
  function fmtDate(d){
    var dt = new Date(d);
    var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return months[dt.getMonth()]+' '+dt.getDate()+', '+dt.getFullYear();
  }
  function fmtDateTime(ts){
    var dt = new Date(ts);
    var h = dt.getHours();
    var ampm = h >= 12 ? 'PM' : 'AM';
    var h12 = h % 12; if(h12 === 0) h12 = 12;
    var mins = dt.getMinutes();
    var minsStr = mins < 10 ? '0'+mins : ''+mins;
    return fmtDate(dt) + ' ' + h12 + ':' + minsStr + ' ' + ampm;
  }
  function shuffleArr(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }
  function resizeImageToSquare(file, size, cb){
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        var side = Math.min(img.width, img.height);
        var sx = (img.width - side) / 2;
        var sy = (img.height - side) / 2;
        var canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
        cb(canvas.toDataURL('image/jpeg', 0.9));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }
  function downloadCSV(filename, headerRow, rows){
    var csv = [headerRow].concat(rows).map(function(row){
      return row.map(function(cell){
        var v = String(cell==null?'':cell).replace(/"/g,'""');
        return '"'+v+'"';
      }).join(',');
    }).join('\r\n');
    var BOM = '\uFEFF'; // ensures Excel renders Bangla (and other non-Latin) text correctly
    var blob = new Blob([BOM + csv], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  /* ================= SIMPLE CHARTS (no external library) ================= */
  function buildDonutSVG(segments, size){
    size = size || 140;
    var total = segments.reduce(function(s,x){return s+x.value;}, 0);
    if(total <= 0){
      return '<div class="empty-note">No data yet.</div>';
    }
    var r = size/2 - 14;
    var cx = size/2, cy = size/2;
    var circumference = 2 * Math.PI * r;
    var offset = 0;
    var circles = segments.map(function(seg){
      var frac = seg.value / total;
      var dash = frac * circumference;
      var circle = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+seg.color+'" stroke-width="20" '+
        'stroke-dasharray="'+dash+' '+(circumference-dash)+'" stroke-dashoffset="'+(-offset)+'" transform="rotate(-90 '+cx+' '+cy+')"/>';
      offset += dash;
      return circle;
    }).join('');
    var svg = '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'">'+circles+
      '<text x="'+cx+'" y="'+(cy+5)+'" text-anchor="middle" font-size="16" font-weight="700" fill="var(--text)" font-family="JetBrains Mono, monospace">'+Math.round((segments[0].value/total)*100)+'%</text>'+
      '</svg>';
    var legend = segments.map(function(seg){
      return '<div class="legend-row"><span class="legend-dot" style="background:'+seg.color+';"></span>'+escapeHtml(seg.label)+' ('+seg.value+')</div>';
    }).join('');
    return '<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;"><div>'+svg+'</div><div>'+legend+'</div></div>';
  }
  function buildBarList(bars){
    if(bars.length === 0) return '<div class="empty-note">No data yet.</div>';
    var max = Math.max.apply(null, bars.map(function(b){return b.value;}).concat([1]));
    return bars.map(function(b){
      var pct = Math.round((b.value/max)*100);
      return '<div class="bar-row"><div class="bar-label" title="'+escapeHtml(b.label)+'">'+escapeHtml(b.label)+'</div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;"></div></div>'+
        '<div class="bar-value">'+b.value+'%</div></div>';
    }).join('');
  }

  /* ================= DATA MODEL ================= */
  var DEFAULT_TEAMS = ['Inbound','Recurring','Telesales','Welcome','Complaint Management'];
  var ROLES = ['User','Team Leader','Management','Admin'];

  function defaultData(){
    var adminId = uid(), leaderId = uid(), user1Id = uid(), user2Id = uid(), mgmtId = uid();
    var q1=uid(), q2=uid(), q3=uid(), q4=uid(), q5=uid();
    return {
      teams: DEFAULT_TEAMS.slice(),
      users: [
        {id:adminId, name:'System Admin', email:'admin@guardianlife.com', password:'admin123', role:'Admin', team:null, mustChangePassword:false, photo:null},
        {id:leaderId, name:'Musfiq Bhai', email:'leader@guardianlife.com', password:'welcome123', role:'Team Leader', team:'Inbound', mustChangePassword:true, photo:null},
        {id:mgmtId, name:'Quality Team', email:'quality@guardianlife.com', password:'welcome123', role:'Management', team:null, mustChangePassword:true, photo:null},
        {id:user1Id, name:'Rahat Hossain', email:'rahat@guardianlife.com', password:'welcome123', role:'User', team:'Inbound', mustChangePassword:true, photo:null},
        {id:user2Id, name:'Sadia Karim', email:'sadia@guardianlife.com', password:'welcome123', role:'User', team:'Telesales', mustChangePassword:true, photo:null}
      ],
      questionBank: [
        {id:q1, team:'Inbound', question:'What is the standard turnaround time mentioned in the retail loan guideline?', options:['Same day','As set in the guideline','No fixed time','Only on weekends'], correctIndex:1, acceptedIndexes:[1]},
        {id:q2, team:'Inbound', question:'Bancassurance product updates are reviewed on what basis?', options:['Daily','Quarterly','Yearly only','Never'], correctIndex:1, acceptedIndexes:[1]},

        {id:q4, team:'Telesales', question:'Who approves access to operational tools?', options:['Any employee','The approval chain for the access tier','No approval needed','Only IT'], correctIndex:1, acceptedIndexes:[1]},

  function supaUrl(table, query){
    return SUPABASE_URL + '/rest/v1/' + table + (query || '');
  }

  async function supaRequest(url, options){
    options = options || {};
    options.headers = Object.assign({}, SUPA_HEADERS, options.headers || {});
    var response = await fetch(url, options);
    var text = await response.text();
    var body = null;
    try { body = text ? JSON.parse(text) : null; } catch(e) { body = text; }
    if(!response.ok){
      var msg = body && body.message ? body.message : text || ('HTTP ' + response.status);
      throw new Error('Supabase ' + response.status + ': ' + msg);
    }
    return body;
  }

  function parseJsonValue(v, fallback){
    if(v === null || v === undefined || v === '') return fallback;
    if(typeof v === 'object') return v;
    try { return JSON.parse(v); } catch(e) { return fallback; }
  }

  function clone(obj){ return JSON.parse(JSON.stringify(obj)); }

  async function readJsonCollection(table){
    var rows = await supaRequest(supaUrl(table, '?select=id,data,created_at,updated_at&order=created_at.asc'));
    return (rows || []).map(function(row){
      var obj = parseJsonValue(row.data, null);
      if(!obj || typeof obj !== 'object') obj = {id: row.id};
      if(!obj.id) obj.id = row.id;
      return obj;
    });
  }

    // (id/name/created_at) without assuming a JSON data column.
    var rows = await supaRequest(supaUrl('users', '?select=*'));
    return (rows || []).map(function(row){
      if(row.data !== undefined && row.data !== null){
        var obj = parseJsonValue(row.data, {id: row.id});
        if(!obj.id) obj.id = row.id;
        return obj;
      }
      return {
        id: row.id,

  async function upsertJsonCollection(table, items){
    items = items || [];
    var rows = items.map(function(item){
      return {id: item.id || uid(), data: JSON.stringify(item), updated_at: new Date().toISOString()};
    });

    // Replace the collection so deletions made in the portal are reflected.
    await supaRequest(supaUrl(table, '?id=not.is.null'), {method:'DELETE'});
    if(rows.length){
      await supaRequest(supaUrl(table), {method:'POST', body: JSON.stringify(rows)});
    }
  }

  async function saveTeams(items){
    // Current Supabase schema: public.teams(id uuid, name text, created_at timestamptz)
    var current = await supaRequest(supaUrl('teams', '?select=id'));
    if(current && current.length){
      await supaRequest(supaUrl('teams', '?id=not.is.null'), {method:'DELETE'});
    }
    var rows = (items || []).map(function(name){
      return {id: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : uid(), name:name, created_at:new Date().toISOString()};
    });
    if(rows.length) await supaRequest(supaUrl('teams'), {method:'POST', body:JSON.stringify(rows)});
  }

  async function saveUsers(items){
    // Current Supabase schema: public.users(id text, data jsonb, created_at, updated_at).
    // Preserve the complete user object inside data so email/password/role/team
    // and mustChangePassword are never lost.
    var rows = (items || []).map(function(u){
      var id = u.id || uid();
      var copy = clone(u);
      copy.id = id;
      return {id:id, data:JSON.stringify(copy), updated_at:new Date().toISOString()};
    });
    if(rows.length){
      await supaRequest(supaUrl('users') + '?on_conflict=id', {
        method:'POST',
        headers:{'Prefer':'resolution=merge-duplicates,return=representation'},
        body:JSON.stringify(rows)
      });
    }
  }

  async function supabaseSaveChanged(payloadObj){
    var keys = Object.keys(payloadObj || {});
    for(var i=0;i<keys.length;i++){
      var key = keys[i];
      if(key === 'teams') await saveTeams(payloadObj[key]);
      else if(key === 'users') await saveUsers(payloadObj[key]);
      else if(key === 'questionBank') await upsertJsonCollection('question_bank', payloadObj[key]);
      else if(key === 'quizzes') await upsertJsonCollection('quizzes', payloadObj[key]);
      else if(key === 'quizAttempts') await upsertJsonCollection('quiz_attempts', payloadObj[key]);
      else if(key === 'disputes') await upsertJsonCollection('disputes', payloadObj[key]);
      else if(key === 'knowledgeUpdates') await upsertJsonCollection('knowledge_updates', payloadObj[key]);
      else if(key === 'teamUsedQuestionIds' || key === 'userCompletedQuizzes' || key === 'userSeenKnowledgeUpdates' || key === 'userLogins'){
        await saveMetaKey(key, payloadObj[key]);
      }
    }
    return true;
  }

  function normalizeData(d){
    if(!d.teams) d.teams = DEFAULT_TEAMS.slice();
    if(!d.teamUsedQuestionIds) d.teamUsedQuestionIds = {};
    if(!d.quizzes) d.quizzes = [];
    if(!d.quizAttempts) d.quizAttempts = [];
    if(!d.disputes) d.disputes = [];
    if(!d.userCompletedQuizzes) d.userCompletedQuizzes = {};
    if(!d.userLogins) d.userLogins = {};
    if(!d.knowledgeUpdates) d.knowledgeUpdates = [];
    if(!d.userSeenKnowledgeUpdates) d.userSeenKnowledgeUpdates = {};
    if(!d.users) d.users = [];
    if(!d.questionBank) d.questionBank = [];
    d.questionBank.forEach(function(q){
      if(!q.acceptedIndexes) q.acceptedIndexes = [q.correctIndex];
      if(!q.createdBy) q.createdBy = {id:null, name:'Legacy / Unknown', email:''};
      if(q.createdAt === undefined) q.createdAt = null;
      if(q.updatedBy === undefined) q.updatedBy = null;
      if(q.updatedAt === undefined) q.updatedAt = null;
    });

    // Build the completed-quiz index from quiz_attempts every time data loads.
    // This is the authoritative source, so users who completed a quiz before
    // the userCompletedQuizzes meta key existed will still be blocked.
    var completedMap = {};
    (d.quizAttempts || []).forEach(function(attempt){
      if(!attempt || !attempt.userId || !attempt.quizId) return;
      if(!completedMap[attempt.userId]) completedMap[attempt.userId] = [];
      if(completedMap[attempt.userId].indexOf(attempt.quizId) === -1){
        completedMap[attempt.userId].push(attempt.quizId);
      }
    });
    Object.keys(d.userCompletedQuizzes || {}).forEach(function(userId){
      if(!completedMap[userId]) completedMap[userId] = [];
      (d.userCompletedQuizzes[userId] || []).forEach(function(quizId){
        if(completedMap[userId].indexOf(quizId) === -1){
          completedMap[userId].push(quizId);
        }
      });
    });
    d.userCompletedQuizzes = completedMap;

    d.users.forEach(function(u){
      if(u.team === undefined) u.team = null;
      if(u.photo === undefined) u.photo = null;
      if(ROLES.indexOf(u.role) === -1) u.role = 'User';
    });
    return d;
  }

  var saveInFlight = false;
  var savePendingAgain = false;
  async function saveData(){
    if(saveInFlight){ savePendingAgain = true; return; }
    saveInFlight = true;
    try{
      var changedKeys = SYNC_KEYS.filter(function(k){
        return JSON.stringify(state.data[k]) !== JSON.stringify(state.lastSyncedData ? state.lastSyncedData[k] : undefined);
      });
      if(changedKeys.length){
        var payload = {};
        changedKeys.forEach(function(k){ payload[k] = state.data[k]; });
        await gsSaveChanged(payload);
      }
      // Pick up anything OTHER sessions saved in the meantime, for every
      // collection this save didn't just touch.
      var raw = await gsGetAllData();
      if(raw){
        var fresh = null;
        try{ fresh = JSON.parse(raw); }catch(e){ fresh = null; }
        if(fresh){
          SYNC_KEYS.forEach(function(k){
            if(changedKeys.indexOf(k) === -1) state.data[k] = fresh[k];
          });
        }
      }
      state.data = normalizeData(state.data);
      state.lastSyncedData = JSON.parse(JSON.stringify(state.data));
    }catch(e){
      console.error('saveData error:', e);
    }
    saveInFlight = false;
    if(savePendingAgain){ savePendingAgain = false; saveData(); }
    render();
  }

  function isAnswerAccepted(question, index){
    return question.acceptedIndexes.indexOf(index) !== -1;

  function recomputeScoresForQuestion(questionId, remarkText){
    var q = state.data.questionBank.find(function(x){return x.id===questionId;});
    if(!q) return;
    state.data.quizAttempts.forEach(function(attempt){
      attempt.answers.forEach(function(ans){
        if(ans.questionId !== questionId) return;
        var shouldBeCorrect = isAnswerAccepted(q, ans.selectedIndex);
        if(shouldBeCorrect && !ans.isCorrect){
          ans.isCorrect = true;
          ans.remark = remarkText || 'Marked correct after dispute review';
          attempt.score += 1;
        }
      });
    });
  }
  function quizStatus(quiz){
    if(!quiz.enabled) return 'off';
    var dt = new Date(quiz.scheduledDate + 'T' + (quiz.scheduledTime||'00:00') + ':00');
    return Date.now() >= dt.getTime() ? 'running' : 'scheduled';
  }

  function isKnowledgeUpdateLive(ku){
    if(ku.status !== 1) return false;
    return new Date(ku.startDateTime).getTime() <= Date.now();
  }
  function liveKnowledgeUpdates(){
    return state.data.knowledgeUpdates.filter(isKnowledgeUpdateLive).sort(function(a,b){ return new Date(b.startDateTime) - new Date(a.startDateTime); });
  }
  function anyUnseenKnowledgeUpdateLive(){
    var seen = state.data.userSeenKnowledgeUpdates[state.currentUserId] || [];
    return liveKnowledgeUpdates().some(function(ku){ return seen.indexOf(ku.id) === -1; });
  }
  function markLiveKnowledgeUpdatesSeen(){
    if(!state.data.userSeenKnowledgeUpdates[state.currentUserId]) state.data.userSeenKnowledgeUpdates[state.currentUserId] = [];
    var seen = state.data.userSeenKnowledgeUpdates[state.currentUserId];
    liveKnowledgeUpdates().forEach(function(ku){ if(seen.indexOf(ku.id) === -1) seen.push(ku.id); });
    saveData();
  }
  function leaderboardData(teamFilter){
    var byUser = {};
    state.data.quizAttempts.forEach(function(a){
      if(teamFilter && a.team !== teamFilter) return;
      if(!byUser[a.userId]) byUser[a.userId] = {score:0, total:0, attempts:0};
      byUser[a.userId].score += a.score;
      byUser[a.userId].total += a.total;
      byUser[a.userId].attempts += 1;
    });
    var rows = Object.keys(byUser).map(function(userId){
      var u = state.data.users.find(function(x){return x.id===userId;});
      if(!u) return null;
      var agg = byUser[userId];
      return {user:u, score:agg.score, total:agg.total, pct: agg.total ? Math.round(agg.score/agg.total*100) : 0, attempts:agg.attempts};
    }).filter(Boolean);
    rows.sort(function(a,b){ if(b.pct!==a.pct) return b.pct-a.pct; return b.score-a.score; });
    return rows;
  }

  /* ================= RENDER ROOT ================= */
  function render(){
    var root = document.getElementById('app');
    root.innerHTML = '';

    if(!state.currentUserId){
      root.appendChild(renderLogin());
      return;
    }
    var user = currentUser();
    if(!user){ state.currentUserId = null; sessionSet(SESSION_KEY,''); render(); return; }

    var shell = document.createElement('div');
    shell.className = 'shell';
    shell.appendChild(renderTopbar());

    if(user.role !== 'Admin' && anyUnseenKnowledgeUpdateLive()){
      shell.appendChild(renderMandatoryKnowledgeGate());
      root.appendChild(shell);
      return;
    }

    if(user.role === 'Admin'){
      if(state.tab === 'users') shell.appendChild(renderUserManagement());
      else if(state.tab === 'teams') shell.appendChild(renderTeamManagement());
      else if(state.tab === 'quizmgmt') shell.appendChild(renderQuizManagement());
      else if(state.tab === 'disputes') shell.appendChild(renderDisputeManagement());
      else if(state.tab === 'knowledge') shell.appendChild(renderKnowledgeUpdatesAdmin());
      else if(state.tab === 'reports') shell.appendChild(renderReports(null));
      else if(state.tab === 'backup') shell.appendChild(renderBackupRestore());
      else if(state.tab === 'audit') shell.appendChild(renderAuditLogAdmin());
      else shell.appendChild(renderUserManagement());
    }else if(user.role === 'Management'){
      shell.appendChild(renderReports(null));
    }else if(user.role === 'Team Leader'){
      shell.appendChild(renderLeaderTabs());
      if(state.tab === 'teamdash') shell.appendChild(renderReports(user.team));
      else if(state.tab === 'password') shell.appendChild(renderChangePassword());
      else shell.appendChild(renderReports(user.team));
    }else{
      shell.appendChild(renderUserTabs());
      if(state.tab === 'quiz') shell.appendChild(renderUserQuizHome());
      else if(state.tab === 'history') shell.appendChild(renderUserHistory());
      else if(state.tab === 'password') shell.appendChild(renderChangePassword());
      else shell.appendChild(renderUserQuizHome());
    }

    root.appendChild(shell);
    if(state.quizSession) root.appendChild(renderQuizModal());
    if(state.viewingAttemptId) root.appendChild(renderAttemptDetailModal());
    if(state.viewingKuId) root.appendChild(renderKnowledgeUpdateViewModal());
    if(state.viewingQuestionAuditId) root.appendChild(renderQuestionAuditModal(state.viewingQuestionAuditId));
  }

    if(state.loginError){
      var err = document.createElement('div');
      err.className = 'login-error';
      err.textContent = state.loginError;
      card.appendChild(err);
    }

    // Real <form> with autocomplete hints so the browser's own

    var form = document.createElement('form');
    form.setAttribute('autocomplete', 'on');

    var emailRow = document.createElement('div');
    emailRow.className = 'form-row';
    emailRow.innerHTML = '<label>Email</label>';
    var emailInput = document.createElement('input');
    emailInput.type = 'email'; emailInput.name = 'email'; emailInput.autocomplete = 'username';
    emailInput.placeholder = 'you@guardianlife.com'; emailInput.required = true;
    emailRow.appendChild(emailInput);
    form.appendChild(emailRow);

    var pwRow = document.createElement('div');
    pwRow.className = 'form-row';
    pwRow.innerHTML = '<label>Password</label>';
    var pwInput = document.createElement('input');
    pwInput.type = 'password'; pwInput.name = 'password'; pwInput.autocomplete = 'current-password';
    pwInput.placeholder = '\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022'; pwInput.required = true;
    pwRow.appendChild(pwInput);
    form.appendChild(pwRow);

    loginBtn.type = 'submit';
    loginBtn.className = 'btn primary btn-full';
    loginBtn.textContent = 'Log in';
    form.appendChild(loginBtn);

    form.addEventListener('submit', function(e){
      e.preventDefault();
      var email = emailInput.value.trim().toLowerCase();
      var pw = pwInput.value;
      var u = state.data.users.find(function(x){ return x.email.toLowerCase() === email; });
      if(!u || u.password !== pw){
        state.loginError = 'Incorrect email or password.';
        render();
        return;
      }
      state.currentUserId = u.id;
      state.loginError = '';
      state.data.userLogins[u.id] = Date.now();
      saveData();
      sessionSet(SESSION_KEY, u.id);
      state.tab = u.role === 'Admin' ? 'users' : (u.role === 'Team Leader' ? 'teamdash' : 'quiz');
      render();
      // Letting the form's own submit event fire (rather than only handling

      // a real login and offer to save the credentials in the browser.

  /* ================= TOP BAR ================= */
  function renderTopbar(){
    var bar = document.createElement('div');
    bar.className = 'topbar';
    var brand = document.createElement('div');
    brand.className = 'brand';
    brand.innerHTML = '<span class="dot"></span>Quiz Portal';
    bar.appendChild(brand);

    var user = currentUser();

    if(user.role === 'Admin'){
      var pendingCount = state.data.disputes.filter(function(d){return d.status==='pending';}).length;
      var adminDestinations = [
        ['users','User Accounts'],['teams','Teams'],['quizmgmt','Quiz Management'],
        ['disputes','Disputes', pendingCount],['knowledge','Knowledge Updates'],
        ['reports','Reports'],['audit','Audit Log'],['backup','Backup & Restore']
      ];
      var menuWrap = document.createElement('div');
      menuWrap.className = 'admin-menu-wrap';
      var menuBtn = document.createElement('button');
      menuBtn.type = 'button'; menuBtn.className = 'admin-menu-btn'; menuBtn.innerHTML = '&#8942;';
      menuBtn.title = 'Admin menu';
      var panel = document.createElement('div');
      panel.className = 'admin-menu-panel' + (state.adminMenuOpen ? ' open' : '');
      adminDestinations.forEach(function(d){
        var item = document.createElement('div');
        item.className = 'admin-menu-item' + (state.tab===d[0] ? ' active' : '');
        item.innerHTML = '<span>'+d[1]+'</span>' + (d[2] ? '<span class="admin-menu-badge">'+d[2]+'</span>' : '');
        item.onclick = function(){
          state.tab = d[0];
          state.editingUserId=null; state.editingQuestionId=null; state.editingQuizId=null; state.editingKuId=null; state.viewingQuestionAuditId=null; state.kuMode='list';
          state.adminMenuOpen = false;
          render();
        };
        panel.appendChild(item);
      });
      menuBtn.onclick = function(e){
        e.stopPropagation();
        state.adminMenuOpen = !state.adminMenuOpen;

      function updateAvailNote(){
        availNote.textContent = currentAvail().length + ' unused question(s) available for ' + teamSel.value + '. Questions already used in an earlier quiz for this team won\u2019t be shown again.';
      }
      card.appendChild(availNote);
      card.appendChild(manualListHolder);

      function renderManualList(){
        manualListHolder.innerHTML = '';
        var avail = currentAvail();
        if(avail.length === 0){
          var none = document.createElement('div');
          none.className = 'empty-note';
          none.textContent = 'No unused questions available for this team.';
          manualListHolder.appendChild(none);
          return;
        }
        avail.forEach(function(q){
          var optRow = document.createElement('label');
          optRow.style.cssText = 'display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer;';
          var cb = document.createElement('input'); cb.type = 'checkbox'; cb.value = q.id; cb.className = 'qManualCheck';
          optRow.appendChild(cb);
          var span = document.createElement('span'); span.textContent = q.question;
          optRow.appendChild(span);
          manualListHolder.appendChild(optRow);
        });
      }

      function refreshMode(){
        var isManual = manualRadio.checked;
        countRow.style.display = isManual ? 'none' : '';
        manualListHolder.style.display = isManual ? '' : 'none';
        if(isManual) renderManualList();
      }
      autoRadio.onchange = refreshMode;
      manualRadio.onchange = refreshMode;
      teamSel.addEventListener('change', function(){ updateAvailNote(); if(manualRadio.checked) renderManualList(); });
      updateAvailNote();
      refreshMode();
    }

    var saveBtn = document.createElement('button');
    saveBtn.className = 'btn primary';
    saveBtn.textContent = editing ? 'Save changes' : 'Create quiz';
    saveBtn.onclick = function(){
      if(!titleInput.value.trim()){ alert('Give the quiz a title.'); return; }
      if(editing){
        editing.title = titleInput.value.trim();
        editing.team = teamSel.value;
        editing.scheduledDate = dateInput.value;
        editing.scheduledTime = timeInput.value;
        editing.durationMinutes = parseInt(durInput.value,10) || 30;
        saveData(); state.editingQuizId = null; render();
        return;
      }
      var used = state.data.teamUsedQuestionIds[teamSel.value] || [];
      var avail = state.data.questionBank.filter(function(q){ return q.team===teamSel.value && used.indexOf(q.id)===-1; });
      if(avail.length === 0){ alert('There are no unused questions left in the bank for this team. Add more questions first.'); return; }

      var isManualMode = document.getElementById('qSelManual').checked;
      var selectedIds;
      if(isManualMode){
        selectedIds = Array.prototype.slice.call(document.querySelectorAll('.qManualCheck:checked')).map(function(cb){return cb.value;});
        if(selectedIds.length === 0){ alert('Select at least one question, or switch to Auto-select.'); return; }
      }else{
        var n = Math.min(parseInt(countInput.value,10)||1, avail.length);
        selectedIds = shuffleArr(avail).slice(0, n).map(function(q){return q.id;});
      }
      var quiz = {
        id: uid(), title: titleInput.value.trim(), team: teamSel.value,
        scheduledDate: dateInput.value, scheduledTime: timeInput.value,
        durationMinutes: parseInt(durInput.value,10) || 30, enabled: true,
        questionIds: selectedIds, createdAt: Date.now()
      };
      state.data.quizzes.push(quiz);
      if(!state.data.teamUsedQuestionIds[teamSel.value]) state.data.teamUsedQuestionIds[teamSel.value] = [];
      state.data.teamUsedQuestionIds[teamSel.value] = state.data.teamUsedQuestionIds[teamSel.value].concat(quiz.questionIds);
      saveData(); render();
    };
    card.appendChild(saveBtn);
    if(editing){
      var cancelBtn = document.createElement('button');
      cancelBtn.className = 'btn secondary'; cancelBtn.style.marginLeft='8px'; cancelBtn.textContent='Cancel';
      cancelBtn.onclick = function(){ state.editingQuizId = null; render(); };
      card.appendChild(cancelBtn);
    }
    wrap.appendChild(card);

    var listCard = document.createElement('div');
    listCard.className = 'card';
    listCard.innerHTML = '<div class="section-title">All quizzes ('+state.data.quizzes.length+')</div>';
    if(state.data.quizzes.length === 0){
      listCard.innerHTML += '<div class="empty-note">No quizzes created yet.</div>';
    }else{
      var table = document.createElement('table');
      table.className = 'data-table';
      table.innerHTML = '<tr><th>Title</th><th>Team</th><th>Run at</th><th>Questions</th><th>Status</th><th></th></tr>';
      state.data.quizzes.slice().sort(function(a,b){return b.createdAt-a.createdAt;}).forEach(function(quiz){
        var st = quizStatus(quiz);
        var badge = st==='running' ? '<span class="status-badge running">Running</span>' : st==='scheduled' ? '<span class="status-badge scheduled">Scheduled</span>' : '<span class="status-badge off">Disabled</span>';
        var tr = document.createElement('tr');
        tr.innerHTML = '<td>'+escapeHtml(quiz.title)+'</td><td>'+escapeHtml(quiz.team)+'</td><td>'+fmtDate(quiz.scheduledDate)+' '+quiz.scheduledTime+'</td><td>'+quiz.questionIds.length+'</td><td>'+badge+'</td>';
        var tdA = document.createElement('td');
        tdA.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;';
        var editBtn = document.createElement('button');
        editBtn.className = 'btn secondary small'; editBtn.textContent = 'Edit';
        editBtn.onclick = function(){ state.editingQuizId = quiz.id; render(); };
        var toggleBtn = document.createElement('button');
        toggleBtn.className = 'btn secondary small'; toggleBtn.textContent = quiz.enabled ? 'Disable' : 'Enable';
        toggleBtn.onclick = function(){ quiz.enabled = !quiz.enabled; saveData(); render(); };
        var delBtn = document.createElement('button');
        delBtn.className = 'btn danger small'; delBtn.textContent = 'Delete';
        delBtn.onclick = function(){
          if(!confirm('Delete "'+quiz.title+'"? Its questions will become available for future quizzes again.')) return;
          state.data.quizzes = state.data.quizzes.filter(function(x){return x.id!==quiz.id;});
          if(state.data.teamUsedQuestionIds[quiz.team]){
            state.data.teamUsedQuestionIds[quiz.team] = state.data.teamUsedQuestionIds[quiz.team].filter(function(id){ return quiz.questionIds.indexOf(id)===-1; });
          }
          saveData(); render();
        };
        tdA.appendChild(editBtn); tdA.appendChild(toggleBtn); tdA.appendChild(delBtn);
        tr.appendChild(tdA);
        table.appendChild(tr);
      });
      listCard.appendChild(table);
    }
    wrap.appendChild(listCard);
    return wrap;
  }

  function buildMiniRichTextEditor(initialHtml, editorId){
    var wrap = document.createElement('div');
    var toolbar = document.createElement('div');
    toolbar.className = 'rte-mini-toolbar';

    var editorBox = document.createElement('div');
    editorBox.id = editorId;
    editorBox.className = 'rte-mini-editor';
    editorBox.contentEditable = 'true';
    editorBox.setAttribute('data-placeholder', 'Write the update content here...');
    editorBox.innerHTML = initialHtml || '';

    function cmdBtn(label, cmd, val, title){
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'rte-mini-btn'; b.innerHTML = label;
      if(title) b.title = title;
      b.onmousedown = function(e){ e.preventDefault(); };
      b.onclick = function(){ document.execCommand(cmd, false, val||null); editorBox.focus(); };
      return b;
    }
    toolbar.appendChild(cmdBtn('<b>B</b>','bold',null,'Bold'));
    toolbar.appendChild(cmdBtn('<i>I</i>','italic',null,'Italic'));
    toolbar.appendChild(cmdBtn('<u>U</u>','underline',null,'Underline'));
    toolbar.appendChild(cmdBtn('&#8226; List','insertUnorderedList',null,'Bulleted list'));
    toolbar.appendChild(cmdBtn('1. List','insertOrderedList',null,'Numbered list'));
    var linkBtn = cmdBtn('&#128279;','createLink',null,'Insert link (opens in a new tab)');
    linkBtn.onclick = function(){
      var url = prompt('Link URL:');
      if(url){
        document.execCommand('createLink', false, url);
        editorBox.querySelectorAll('a').forEach(function(a){ a.setAttribute('target','_blank'); a.setAttribute('rel','noopener noreferrer'); });
      }
      editorBox.focus();
    };
    toolbar.appendChild(linkBtn);
    toolbar.appendChild(cmdBtn('Clear','removeFormat',null,'Clear formatting'));

    wrap.appendChild(toolbar);
    wrap.appendChild(editorBox);
    return wrap;
  }

    wrap.appendChild(backupCard);

    var restoreCard = document.createElement('div');
    restoreCard.className = 'card';
    restoreCard.innerHTML = '<div class="section-title">Restore from a snapshot</div><div style="font-size:12px;color:var(--text-dim);margin-bottom:12px;">This replaces everything currently in the Google Sheet with the contents of the snapshot file. Anything created since that snapshot will be lost.</div>';
    var fileInput = document.createElement('input');
    fileInput.type = 'file'; fileInput.accept = '.json,application/json';
    fileInput.style.marginBottom = '10px';
    restoreCard.appendChild(fileInput);
    var restoreBtn = document.createElement('button');
    restoreBtn.className = 'btn danger';
    restoreBtn.textContent = 'Restore this snapshot';
    restoreBtn.onclick = function(){
      var f = fileInput.files[0];
      if(!f){ alert('Choose a snapshot file first.'); return; }
      if(!confirm('This will replace all current data in the Google Sheet with the snapshot file. Continue?')) return;
      var reader = new FileReader();
      reader.onload = async function(){
        try{
          var parsed = JSON.parse(reader.result);
          if(!parsed.users || !parsed.questionBank){ alert('This doesn\u2019t look like a valid Quiz Portal snapshot file.'); return; }
          state.data = normalizeData(parsed);
          state.lastSyncedData = null; // force every collection to be treated as changed
          await saveData();
          alert('Snapshot restored to the Google Sheet. The page will now reload.');
          location.reload();
        }catch(e){
          alert('Could not read this file. Make sure it\u2019s a Quiz Portal snapshot (.json) file.');
        }
      };
      reader.readAsText(f);
    };
    restoreCard.appendChild(restoreBtn);
    wrap.appendChild(restoreCard);

    return wrap;
  }

  /* ================= DISPUTE MANAGEMENT (admin) ================= */
  function renderDisputeManagement(){
    var wrap = document.createElement('div');
    var pending = state.data.disputes.filter(function(d){return d.status==='pending';});
    var resolved = state.data.disputes.filter(function(d){return d.status!=='pending';}).sort(function(a,b){return b.resolvedAt-a.resolvedAt;});

    var pendingCard = document.createElement('div');
    pendingCard.className = 'card';
    pendingCard.innerHTML = '<div class="section-title">Pending disputes ('+pending.length+')</div>';
    if(pending.length === 0){
      pendingCard.innerHTML += '<div class="empty-note">No disputes waiting for review.</div>';
    }else{
      pending.forEach(function(d){
        var block = document.createElement('div');
        block.style.cssText = 'border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:12px;';
        block.innerHTML =
          '<div style="font-size:13px;font-weight:600;margin-bottom:4px;">'+escapeHtml(d.questionText)+'</div>'+
          '<div style="font-size:12px;color:var(--text-dim);margin-bottom:4px;">Raised by <b>'+escapeHtml(d.userName)+'</b> ('+escapeHtml(d.team||'\u2014')+') on '+fmtDateTime(d.createdAt)+'</div>'+
          '<div style="font-size:12px;margin-bottom:4px;">CSO\u2019s answer: <b>'+escapeHtml(d.selectedOption)+'</b> &middot; Originally marked correct: <b>'+escapeHtml(d.originalCorrectOption)+'</b></div>'+
          (d.note ? '<div style="font-size:12px;color:var(--text-dim);font-style:italic;margin-bottom:8px;">\u201c'+escapeHtml(d.note)+'\u201d</div>' : '');

        var noteInput = document.createElement('textarea');
        noteInput.placeholder = 'Admin note (optional, shown in the resolved log)';
        noteInput.style.cssText = 'width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;margin:8px 0;min-height:50px;';
        block.appendChild(noteInput);

        var btnRow = document.createElement('div');
        btnRow.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;';

        function resolveDispute(resolution){
          d.status = 'resolved'; d.resolution = resolution; d.adminNote = noteInput.value.trim(); d.resolvedAt = Date.now();
          var q = state.data.questionBank.find(function(x){return x.id===d.questionId;});
          if(q && (resolution === 'disputed_correct' || resolution === 'both_correct')){
            if(q.acceptedIndexes.indexOf(d.selectedIndex) === -1) q.acceptedIndexes.push(d.selectedIndex);
            var remarkText = resolution === 'both_correct' ? 'Both answers are accepted as correct for this question.' : 'Your answer was accepted as correct after a dispute review.';
            recomputeScoresForQuestion(d.questionId, remarkText);
          }
          saveData(); render();
        }
        var btnDisputed = document.createElement('button');
        btnDisputed.className = 'btn primary small'; btnDisputed.textContent = 'Disputed answer is correct';
        btnDisputed.onclick = function(){ resolveDispute('disputed_correct'); };
        var btnOriginal = document.createElement('button');
        btnOriginal.className = 'btn secondary small'; btnOriginal.textContent = 'Original answer confirmed correct';
        btnOriginal.onclick = function(){ resolveDispute('original_correct'); };
        var btnBoth = document.createElement('button');
        btnBoth.className = 'btn secondary small'; btnBoth.textContent = 'Both answers accepted';
        btnBoth.onclick = function(){ resolveDispute('both_correct'); };
        btnRow.appendChild(btnDisputed); btnRow.appendChild(btnOriginal); btnRow.appendChild(btnBoth);
        block.appendChild(btnRow);
        pendingCard.appendChild(block);
      });
    }
    wrap.appendChild(pendingCard);

    var resolvedCard = document.createElement('div');
    resolvedCard.className = 'card';
    resolvedCard.innerHTML = '<div class="section-title">Resolved disputes ('+resolved.length+')</div>';
    if(resolved.length === 0){
      resolvedCard.innerHTML += '<div class="empty-note">No disputes resolved yet.</div>';
    }else{
      var resTable = document.createElement('table');
      resTable.className = 'data-table';
      resTable.innerHTML = '<tr><th>Question</th><th>Raised by</th><th>Outcome</th><th>Resolved</th></tr>';
      var resolutionLabels = {disputed_correct:'Disputed answer accepted', original_correct:'Original answer confirmed', both_correct:'Both answers accepted'};
      resolved.forEach(function(d){
        var tr = document.createElement('tr');
        tr.innerHTML = '<td>'+escapeHtml(d.questionText)+'</td><td>'+escapeHtml(d.userName)+'</td><td>'+(resolutionLabels[d.resolution]||d.resolution)+'</td><td>'+fmtDateTime(d.resolvedAt)+'</td>';
        resTable.appendChild(tr);
      });
      resolvedCard.appendChild(resTable);
    }
    wrap.appendChild(resolvedCard);
    return wrap;
  }

    var available = state.data.quizzes.filter(function(q){
      return q.team === user.team &&
             quizStatus(q) !== 'off' &&
             completed.indexOf(q.id) === -1;
    });

          '<div class="quiz-list-meta">'+quiz.questionIds.length+' question(s) &middot; '+quiz.durationMinutes+' min &middot; '+fmtDate(quiz.scheduledDate)+' at '+quiz.scheduledTime+'</div>';
        row.appendChild(info);
        var actionBtn = document.createElement('button');
        if(alreadyDone){
          actionBtn.className = 'btn secondary small'; actionBtn.textContent = 'Completed'; actionBtn.disabled = true;

          actionBtn.className = 'btn secondary small'; actionBtn.textContent = 'Scheduled'; actionBtn.disabled = true;

          actionBtn.className = 'btn primary small'; actionBtn.textContent = 'Start quiz';
          actionBtn.onclick = function(){ openQuiz(quiz); };
        }
        row.appendChild(actionBtn);
        card.appendChild(row);
      });
    }
    wrap.appendChild(card);
    return wrap;
  }

  function renderAnswerReviewBlock(attempt, ans, idx, keyPrefix){
    var block = document.createElement('div');
    block.className = 'review-block';
    block.innerHTML = '<div class="review-q">'+escapeHtml(ans.questionText)+'</div>'+
      '<div class="review-a">Your answer: <b style="color:'+(ans.isCorrect?'var(--green)':'var(--red)')+';">'+escapeHtml(ans.selectedOption)+'</b>'+(ans.isCorrect?'':' &middot; Correct: '+escapeHtml(ans.correctOption))+'</div>'+
      (ans.remark ? '<div class="review-remark">\u2713 '+escapeHtml(ans.remark)+'</div>' : '');

    if(!ans.isCorrect){
      var disputeKey = keyPrefix + '-' + idx;
      if(state.disputingAnswerIndex === disputeKey){
        var noteInput = document.createElement('textarea');
        noteInput.placeholder = 'Why do you think your answer should be correct? (optional)';
        noteInput.style.cssText = 'width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;margin-top:8px;min-height:60px;';
        block.appendChild(noteInput);
        var submitBtn = document.createElement('button');
        submitBtn.className = 'btn primary small'; submitBtn.style.marginTop = '8px'; submitBtn.textContent = 'Submit dispute';
        submitBtn.onclick = function(){
          var user = currentUser();
          state.data.disputes.push({
            id: uid(), attemptId: attempt.id, userId: state.currentUserId, userName: user.name, team: user.team,
            questionId: ans.questionId, questionText: ans.questionText,
            selectedIndex: ans.selectedIndex, selectedOption: ans.selectedOption,
            originalCorrectIndex: ans.correctIndex, originalCorrectOption: ans.correctOption,
            options: ans.options, note: noteInput.value.trim(),
            status: 'pending', resolution: null, adminNote: '', createdAt: Date.now(), resolvedAt: null
          });
          saveData(); state.disputingAnswerIndex = null; render();
        };
        block.appendChild(submitBtn);
        var cancelDBtn = document.createElement('button');
        cancelDBtn.className = 'btn secondary small'; cancelDBtn.style.marginTop = '8px'; cancelDBtn.style.marginLeft = '6px'; cancelDBtn.textContent = 'Cancel';
        cancelDBtn.onclick = function(){ state.disputingAnswerIndex = null; render(); };
        block.appendChild(cancelDBtn);
      }else{
        var existingDispute = state.data.disputes.find(function(d){ return d.attemptId === attempt.id && d.questionId === ans.questionId; });
        var disputeBtn = document.createElement('button');
        disputeBtn.className = 'btn secondary small'; disputeBtn.style.marginTop = '8px';
        if(existingDispute){
          disputeBtn.textContent = existingDispute.status === 'pending' ? 'Dispute submitted \u2014 pending review' : 'Dispute reviewed';
          disputeBtn.disabled = true;
        }else{
          disputeBtn.textContent = 'Raise a dispute';
          disputeBtn.onclick = function(){ state.disputingAnswerIndex = disputeKey; render(); };
        }
        block.appendChild(disputeBtn);
      }
    }
    return block;
  }

  function renderUserHistory(){
    var wrap = document.createElement('div');
    var card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = '<div class="section-title">My quiz history</div>';

    var filterRow = document.createElement('div');
    filterRow.className = 'filter-row';
    var titleFilterEl = document.createElement('div'); titleFilterEl.className = 'form-row';
    titleFilterEl.innerHTML = '<label>Search by quiz title</label>';
    var titleInput = document.createElement('input'); titleInput.type = 'text'; titleInput.placeholder = 'e.g. Daily Quiz';
    titleInput.value = state.historySearchTitle;
    titleInput.oninput = function(){ state.historySearchTitle = titleInput.value; titleSelect.value=''; renderHistoryList(); };
    titleFilterEl.appendChild(titleInput);

    var titleSelectEl = document.createElement('div'); titleSelectEl.className = 'form-row';
    titleSelectEl.innerHTML = '<label>Or pick from your quizzes</label>';
    var titleSelect = document.createElement('select');
    var allOp = document.createElement('option'); allOp.value=''; allOp.textContent='All quizzes';
    titleSelect.appendChild(allOp);
    var myQuizTitles = [];
    state.data.quizAttempts.filter(function(a){return a.userId===state.currentUserId;}).forEach(function(a){
      if(myQuizTitles.indexOf(a.quizTitle) === -1) myQuizTitles.push(a.quizTitle);
    });
    myQuizTitles.sort().forEach(function(t){
      var op = document.createElement('option'); op.value = t; op.textContent = t;
      if(state.historySearchTitle === t) op.selected = true;
      titleSelect.appendChild(op);
    });
    titleSelect.onchange = function(){ state.historySearchTitle = titleSelect.value; titleInput.value = titleSelect.value; renderHistoryList(); };
    titleSelectEl.appendChild(titleSelect);

    var dateFilterEl = document.createElement('div'); dateFilterEl.className = 'form-row';
    dateFilterEl.innerHTML = '<label>Filter by date</label>';
    var dateInput = document.createElement('input'); dateInput.type = 'date'; dateInput.value = state.historySearchDate;
    dateInput.onchange = function(){ state.historySearchDate = dateInput.value; renderHistoryList(); };
    dateFilterEl.appendChild(dateInput);
    var clearBtn = document.createElement('button');
    clearBtn.className = 'btn secondary small'; clearBtn.textContent = 'Clear filters';
    clearBtn.onclick = function(){ state.historySearchTitle=''; state.historySearchDate=''; render(); };
    filterRow.appendChild(titleFilterEl); filterRow.appendChild(titleSelectEl); filterRow.appendChild(dateFilterEl); filterRow.appendChild(clearBtn);
    card.appendChild(filterRow);

    var listHolder = document.createElement('div');
    card.appendChild(listHolder);

    function renderHistoryList(){
      listHolder.innerHTML = '';
      var myAttempts = state.data.quizAttempts.filter(function(a){return a.userId===state.currentUserId;});
      if(state.historySearchTitle.trim()){
        var q = state.historySearchTitle.trim().toLowerCase();
        myAttempts = myAttempts.filter(function(a){ return a.quizTitle.toLowerCase().indexOf(q) !== -1; });
      }
      if(state.historySearchDate){
        myAttempts = myAttempts.filter(function(a){ return a.quizDate === state.historySearchDate; });
      }
      myAttempts.sort(function(a,b){return b.finishedAt-a.finishedAt;});
      if(myAttempts.length === 0){
        listHolder.innerHTML = '<div class="empty-note">No matching quiz history.</div>';
        return;
      }
      myAttempts.forEach(function(a){
        var pct = Math.round(a.score/a.total*100);
        var block = document.createElement('div');
        block.style.cssText = 'border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px;';
        var head = document.createElement('div');
        head.style.cssText = 'display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;';
        head.innerHTML = '<div><div style="font-weight:700;font-size:14px;">'+escapeHtml(a.quizTitle)+'</div><div style="font-size:11px;color:var(--text-dim);">'+fmtDate(a.quizDate)+' &middot; completed '+fmtDateTime(a.finishedAt)+'</div></div>'+
          '<div style="font-weight:700;font-size:15px;">'+a.score+' / '+a.total+' ('+pct+'%)</div>';
        block.appendChild(head);

        var toggleBtn = document.createElement('button');
        toggleBtn.className = 'btn secondary small'; toggleBtn.style.marginTop = '10px';
        toggleBtn.textContent = 'View questions & answers';
        var reviewHolder = document.createElement('div');
        reviewHolder.style.display = 'none';
        reviewHolder.style.marginTop = '10px';
        toggleBtn.onclick = function(){
          var showing = reviewHolder.style.display !== 'none';
          reviewHolder.style.display = showing ? 'none' : 'block';
          toggleBtn.textContent = showing ? 'View questions & answers' : 'Hide questions & answers';
        };
        (a.answers||[]).forEach(function(ans, idx){
          reviewHolder.appendChild(renderAnswerReviewBlock(a, ans, idx, 'hist-'+a.id));
        });
        block.appendChild(toggleBtn);
        block.appendChild(reviewHolder);
        listHolder.appendChild(block);
      });
    }
    renderHistoryList();
    wrap.appendChild(card);
    return wrap;
  }

  /* ================= USER: CHANGE PASSWORD ================= */
  function renderChangePassword(){
    var wrap = document.createElement('div');
    var card = document.createElement('div');
    card.className = 'card';
    card.style.maxWidth = '420px';
    card.innerHTML = '<div class="section-title">Change your password</div>';

    if(state.changePwError){
      var err = document.createElement('div'); err.className = 'login-error'; err.textContent = state.changePwError;
      card.appendChild(err);
    }
    if(state.changePwSuccess){
      var ok = document.createElement('div');
      ok.style.cssText = 'background:var(--green-bg);color:var(--green);font-size:12px;padding:9px 12px;border-radius:8px;margin-bottom:14px;';
      ok.textContent = 'Your password has been updated.';
      card.appendChild(ok);
    }
    var curInput = document.createElement('input'); curInput.type = 'password';
    var newInput = document.createElement('input'); newInput.type = 'password';
    var confirmInput = document.createElement('input'); confirmInput.type = 'password';
    function row(labelText, el){
      var r = document.createElement('div'); r.className = 'form-row';
      var l = document.createElement('label'); l.textContent = labelText;
      r.appendChild(l); r.appendChild(el);
      return r;
    }
    card.appendChild(row('Current password', curInput));
    card.appendChild(row('New password', newInput));
    card.appendChild(row('Confirm new password', confirmInput));

    var saveBtn = document.createElement('button');
    saveBtn.className = 'btn primary';
    saveBtn.textContent = 'Update password';
    saveBtn.onclick = function(){
      var user = currentUser();
      if(curInput.value !== user.password){ state.changePwError = 'Your current password is incorrect.'; state.changePwSuccess = false; render(); return; }
      if(!newInput.value || newInput.value.length < 6){ state.changePwError = 'New password must be at least 6 characters.'; state.changePwSuccess = false; render(); return; }
      if(newInput.value !== confirmInput.value){ state.changePwError = 'New password and confirmation do not match.'; state.changePwSuccess = false; render(); return; }
      user.password = newInput.value; user.mustChangePassword = false;
      state.changePwError = ''; state.changePwSuccess = true;
      saveData(); render();
    };
    card.appendChild(saveBtn);
    wrap.appendChild(card);
    return wrap;
  }

  /* ================= QUIZ TAKING ================= */
  function openQuiz(quiz){
    var userId = state.currentUserId;
    var alreadyAttempted = (state.data.quizAttempts || []).some(function(attempt){
      return attempt && attempt.userId === userId && attempt.quizId === quiz.id;
    });
    if(alreadyAttempted){
      notify('You have already completed this quiz.','error');
      return;
    }

    var qs = {
      quiz: quiz,
      questions: quiz.questionIds.map(function(id){ return state.data.questionBank.find(function(q){return q.id===id;}); }).filter(Boolean),
      index: 0, selections: {}, done: false,
      startedAt: Date.now(), deadline: Date.now() + quiz.durationMinutes*60000,
      attemptId: null
    };
    state.quizSession = qs;
    render();
  }

  var quizTimerInterval = null;
  function startQuizModalTimer(){
    if(quizTimerInterval) clearInterval(quizTimerInterval);
    function tick(){
      var el = document.getElementById('quizTimer');
      var qs = state.quizSession;
      if(!el || !qs || qs.done){ clearInterval(quizTimerInterval); return; }
      var diff = Math.max(0, qs.deadline - Date.now());
      var m = Math.floor(diff/60000);
      var s = Math.floor((diff%60000)/1000);
      function p(n){ return n<10 ? '0'+n : ''+n; }
      el.textContent = m+':'+p(s);
      el.classList.toggle('low', diff <= 30000);
      if(diff <= 0){
        clearInterval(quizTimerInterval);
        finishQuiz();
      }
    }
    tick();
    quizTimerInterval = setInterval(tick, 1000);
  }

  function renderQuizModal(){
    var overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    var box = document.createElement('div');
    box.className = 'modal-box';
    var qs = state.quizSession;

    if(!qs.done){
      var head = document.createElement('div');
      head.className = 'modal-head';
      head.innerHTML = '<div class="modal-title">'+escapeHtml(qs.quiz.title)+'</div><span class="quiz-timer" id="quizTimer"></span>';
      box.appendChild(head);
      startQuizModalTimer();

      var dots = document.createElement('div');
      dots.className = 'quiz-dots';
      qs.questions.forEach(function(q, i){
        var dot = document.createElement('div');
        dot.className = 'quiz-dot' + (i===qs.index?' current':'') + (qs.selections[i]!==undefined?' answered':'');
        dot.textContent = i+1;
        dot.onclick = function(){ qs.index = i; render(); };
        dots.appendChild(dot);
      });
      box.appendChild(dots);

      var progress = document.createElement('div');
      progress.className = 'quiz-progress';
      progress.textContent = 'Question ' + (qs.index+1) + ' of ' + qs.questions.length;
      box.appendChild(progress);

      var q = qs.questions[qs.index];
      var qEl = document.createElement('div');
      qEl.className = 'quiz-question';
      qEl.textContent = q.question;
      box.appendChild(qEl);

      q.options.forEach(function(opt, i){
        var b = document.createElement('button');
        b.className = 'quiz-option' + (qs.selections[qs.index]===i ? ' selected' : '');
        b.textContent = opt;
        b.onclick = function(){ qs.selections[qs.index] = i; render(); };
        box.appendChild(b);
      });

      var navRow = document.createElement('div');
      navRow.className = 'quiz-nav-row';
      var prevBtn = document.createElement('button');
      prevBtn.className = 'btn secondary'; prevBtn.textContent = '\u2190 Previous';
      prevBtn.disabled = qs.index === 0;
      prevBtn.onclick = function(){ qs.index -= 1; render(); };
      navRow.appendChild(prevBtn);

      var isLast = qs.index === qs.questions.length - 1;
      var nextBtn = document.createElement('button');
      nextBtn.className = 'btn primary';
      nextBtn.textContent = isLast ? 'Submit quiz' : 'Next \u2192';
      nextBtn.onclick = function(){
        if(isLast){
          var unanswered = qs.questions.length - Object.keys(qs.selections).length;
          if(unanswered > 0){
            if(!confirm(unanswered + ' question(s) are still unanswered. Submit anyway?')) return;
          }
          finishQuiz();
        }else{
          qs.index += 1; render();
        }
      };
      navRow.appendChild(nextBtn);
      box.appendChild(navRow);

      var submitNowBtn = document.createElement('button');
      submitNowBtn.className = 'btn secondary small';
      submitNowBtn.style.marginTop = '10px';
      submitNowBtn.textContent = 'Submit quiz now';
      submitNowBtn.onclick = function(){
        var unanswered = qs.questions.length - Object.keys(qs.selections).length;
        var msg = unanswered > 0 ? unanswered + ' question(s) are still unanswered. Submit anyway?' : 'Submit the quiz now?';
        if(confirm(msg)) finishQuiz();
      };
      box.appendChild(submitNowBtn);
    }else{
      var user = currentUser();
      var head2 = document.createElement('div');
      head2.className = 'modal-head';
      head2.innerHTML = '<div class="modal-title">Quiz complete</div>';
      box.appendChild(head2);
      var result = document.createElement('div');
      result.className = 'quiz-result';
      result.innerHTML = '<div class="score">'+qs.finalScore+' / '+qs.questions.length+'</div><div style="font-size:12px;color:var(--text-dim);margin-top:8px;">Your result has been saved. You can review it anytime under My History.</div>';
      box.appendChild(result);

      var reviewTitle = document.createElement('div');
      reviewTitle.className = 'section-title';
      reviewTitle.textContent = 'Review your answers';
      box.appendChild(reviewTitle);

      var attempt = state.data.quizAttempts.find(function(a){return a.id===qs.attemptId;});
      if(attempt){
        attempt.answers.forEach(function(ans, idx){
          box.appendChild(renderAnswerReviewBlock(attempt, ans, idx, 'live-'+attempt.id));
        });
      }

      var doneBtn = document.createElement('button');
      doneBtn.className = 'btn primary'; doneBtn.style.marginTop = '6px'; doneBtn.textContent = 'Close';
      doneBtn.onclick = function(){ state.quizSession = null; state.disputingAnswerIndex = null; state.tab = 'history'; render(); };
      box.appendChild(doneBtn);
    }
    overlay.appendChild(box);
    return overlay;
  }

  async function finishQuiz(){
    var qs = state.quizSession;
    if(qs.done) return;

    var user = currentUser();

    // Prevent duplicate submission using the locally loaded attempts.
    var duplicateAttempt = (state.data.quizAttempts || []).some(function(attempt){
      return attempt && attempt.userId === state.currentUserId && attempt.quizId === qs.quiz.id;
    });
    if(duplicateAttempt){
      qs.done = true;
      state.quizSession = null;
      notify('You have already completed this quiz.','error');
      render();
      return;
    }

    var score = 0;
    var answers = qs.questions.map(function(q, i){
      var selIndex = qs.selections[i];
      var hasSelection = selIndex !== undefined;
      var isCorrect = hasSelection && isAnswerAccepted(q, selIndex);
      if(isCorrect) score += 1;
      return {
        questionId: q.id, questionText: q.question, options: q.options,
        selectedIndex: hasSelection ? selIndex : -1,
        correctIndex: q.correctIndex,
        selectedOption: hasSelection ? q.options[selIndex] : 'No answer given',
        correctOption: q.options[q.correctIndex],
        isCorrect: isCorrect
      };
    });
    var attempt = {
      id: uid(), quizId: qs.quiz.id, quizTitle: qs.quiz.title, quizDate: qs.quiz.scheduledDate,
      userId: state.currentUserId, userName: user.name, userEmail: user.email, team: user.team,
      score: score, total: qs.questions.length, date: new Date().toISOString().slice(0,10),
      finishedAt: Date.now(), answers: answers
    };
    state.data.quizAttempts.push(attempt);
    if(!state.data.userCompletedQuizzes[state.currentUserId]) state.data.userCompletedQuizzes[state.currentUserId] = [];
    state.data.userCompletedQuizzes[state.currentUserId].push(qs.quiz.id);
    qs.attemptId = attempt.id;
    qs.finalScore = score;
    qs.done = true;
    await saveData();
    state.quizSession = null;
    state.tab = 'history';
    render();
  }

  loadData();
})();
</script>
